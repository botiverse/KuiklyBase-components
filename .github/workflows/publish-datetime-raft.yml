# Publish DatetimeKMM to Raft Artifacts (Raft-only lane, task #106).
#
# New versions publish ONLY to our own registry (artin's standing rule); no
# GitHub Packages write exists anywhere in this lane. The Gradle build has no
# remote repository: publications are staged into a task-scoped file Maven
# repository, hashed there, and uploaded by scripts/raft-publish.py with
# create-only semantics and a byte-exact readback.
#
# Credential lifecycle (platform rule): a task-minted short-lived scoped token
# is injected into the raft-artifacts-production environment before dispatch
# and revoked right after the verified readback. Without it the write jobs
# fail closed before any network use.
name: Publish DatetimeKMM to Raft Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional; must be empty or byte-equal to committed DatetimeKMM/gradle.properties mavenVersion"
        required: false
        type: string

# Serialize publish runs so two dispatches can never double-publish the same
# immutable coordinate (non-canceling: a running publish is not interrupted).
concurrency:
  group: datetime-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  ANDROID_SDK_ZIP: https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip
  DATETIME_SOURCE_SHA: ${{ github.sha }}

jobs:
  admission:
    name: Admission guard (master ref + committed version)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate ref and version
        id: resolve
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/master" ]]; then
            echo "::error::publish is only allowed from refs/heads/master (got ${GITHUB_REF})"; exit 1
          fi
          committed="$(grep '^mavenVersion=' DatetimeKMM/gradle.properties | cut -d= -f2)"
          if [[ -n "${REQUESTED_VERSION:-}" && "$REQUESTED_VERSION" != "$committed" ]]; then
            echo "::error::requested version '${REQUESTED_VERSION}' != committed mavenVersion '${committed}'; bump via a source PR first"; exit 1
          fi
          if ! printf '%s' "$committed" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::unsafe mavenVersion format: ${committed}"; exit 1
          fi
          echo "Publishing version: $committed"
          echo "version=$committed" >> "$GITHUB_OUTPUT"

  # --- Global pre-publish legal preflight barrier ---------------------------
  # Each platform produces an isolated staging publication of the exact
  # committed source and runs the legal byte-equality gate BEFORE any remote
  # mutation. Every write job depends on the full barrier, so no platform can
  # start a remote upload while another platform's exact staging/legal gate is
  # red.
  preflight-android:
    name: Preflight isolated publication + legal (Android/normal)
    needs: admission
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bytemain/harmony-next-pipeline-docker/harmonyos-ci-image:v6.1.1.280
    env:
      MAVEN_VERSION: ${{ needs.admission.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
        shell: bash
      - name: Isolated publication + legal gate (normal)
        shell: bash
        working-directory: DatetimeKMM
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/preflight-staging"; rm -rf "$staging"
          DATETIME_STAGING_DIR="$staging" ./gradlew -PmavenVersion="$MAVEN_VERSION" :datetime:publish \
            --no-daemon --console=plain --stacktrace
          bash scripts/verify-publication-legal.sh "$staging" normal
          python3 scripts/raft-publish.py audit-staging --staging "$staging"

  preflight-ohos:
    name: Preflight isolated publication + legal (OHOS)
    needs: admission
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bytemain/harmony-next-pipeline-docker/harmonyos-ci-image:v6.1.1.280
    env:
      MAVEN_VERSION: ${{ needs.admission.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
        shell: bash
      - name: Resolve HarmonyOS SDK
        shell: bash
        run: |
          set -euo pipefail
          ohos_sdk_home="${OHOS_SDK_HOME:-${OHOS_BASE_SDK_HOME:-/opt/harmonyos-tools/command-line-tools/sdk/default/openharmony}}"
          test -d "$ohos_sdk_home/native/sysroot" || { echo "HarmonyOS SDK sysroot not found"; exit 1; }
          ohos_sdk_home="$(cd "$ohos_sdk_home" && pwd)"
          echo "OHOS_SDK_HOME=$ohos_sdk_home" >> "$GITHUB_ENV"
          echo "OHOS_BASE_SDK_HOME=$ohos_sdk_home" >> "$GITHUB_ENV"
          echo "OHOS_NDK_HOME=$ohos_sdk_home/native" >> "$GITHUB_ENV"
          echo "OHOS_LLVM_HOME=$ohos_sdk_home/native/llvm" >> "$GITHUB_ENV"
          echo "DEVECO_SDK_HOME=$(cd "$ohos_sdk_home/../.." && pwd)" >> "$GITHUB_ENV"
          echo "DEVECO_STUDIO_HOME=$(cd "$ohos_sdk_home/../../.." && pwd)" >> "$GITHUB_ENV"
          echo "$ohos_sdk_home/native/llvm/bin" >> "$GITHUB_PATH"
      - name: Isolated publication + legal gate (OHOS)
        shell: bash
        working-directory: DatetimeKMM
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/preflight-staging"; rm -rf "$staging"
          DATETIME_STAGING_DIR="$staging" ./gradlew -c settings.ohos.gradle.kts -PmavenVersion="$MAVEN_VERSION" :datetime:publish \
            --no-daemon --console=plain --stacktrace
          bash scripts/verify-publication-legal.sh "$staging" ohos
          python3 scripts/raft-publish.py audit-staging --staging "$staging"

  preflight-ios:
    name: Preflight isolated publication + legal (iOS)
    needs: admission
    runs-on: macos-latest
    env:
      ANDROID_HOME: /tmp/android-sdk
      ANDROID_SDK_ROOT: /tmp/android-sdk
      MAVEN_VERSION: ${{ needs.admission.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL "$ANDROID_SDK_ZIP" -o /tmp/act.zip
          unzip -q /tmp/act.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
      - name: Isolated publication + legal gate (iOS)
        shell: bash
        working-directory: DatetimeKMM
        run: |
          set -euo pipefail
          staging="$RUNNER_TEMP/preflight-staging"; rm -rf "$staging"
          DATETIME_STAGING_DIR="$staging" ./gradlew -PmavenVersion="$MAVEN_VERSION" :datetime:publish \
            --no-daemon --console=plain --stacktrace
          bash scripts/verify-publication-legal.sh "$staging" ios
          python3 scripts/raft-publish.py audit-staging --staging "$staging"

  # --- Write jobs (depend on the full preflight barrier) --------------------
  publish-ohos-tree:
    name: "Publish OHOS tree (ohosArm64 + root, -ohos)"
    needs: [admission, preflight-android, preflight-ohos, preflight-ios]
    runs-on: ubuntu-latest
    environment: raft-artifacts-production
    container:
      image: ghcr.io/bytemain/harmony-next-pipeline-docker/harmonyos-ci-image:v6.1.1.280
    permissions:
      contents: read
    env:
      DATETIME_PUBLISH_MODE: ohos-tree
      DATETIME_SETTINGS_FILE: settings.ohos.gradle.kts
      MAVEN_VERSION: ${{ needs.admission.outputs.version }}
    outputs:
      published_count: ${{ steps.publish.outputs.published_count }}
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
        shell: bash
      - name: Resolve HarmonyOS SDK
        shell: bash
        run: |
          set -euo pipefail
          ohos_sdk_home="${OHOS_SDK_HOME:-${OHOS_BASE_SDK_HOME:-/opt/harmonyos-tools/command-line-tools/sdk/default/openharmony}}"
          test -d "$ohos_sdk_home/native/sysroot" || { echo "HarmonyOS SDK sysroot not found"; exit 1; }
          ohos_sdk_home="$(cd "$ohos_sdk_home" && pwd)"
          echo "OHOS_SDK_HOME=$ohos_sdk_home" >> "$GITHUB_ENV"; echo "OHOS_BASE_SDK_HOME=$ohos_sdk_home" >> "$GITHUB_ENV"
          echo "OHOS_NDK_HOME=$ohos_sdk_home/native" >> "$GITHUB_ENV"; echo "OHOS_LLVM_HOME=$ohos_sdk_home/native/llvm" >> "$GITHUB_ENV"
          echo "DEVECO_SDK_HOME=$(cd "$ohos_sdk_home/../.." && pwd)" >> "$GITHUB_ENV"
          echo "DEVECO_STUDIO_HOME=$(cd "$ohos_sdk_home/../../.." && pwd)" >> "$GITHUB_ENV"
          echo "$ohos_sdk_home/native/llvm/bin" >> "$GITHUB_PATH"
      - name: Stage, classify, publish, verify (fail-closed)
        id: publish
        shell: bash
        env:
          RAFT_ARTIFACTS_USERNAME: raft-ci
          RAFT_ARTIFACTS_PUBLISH_TOKEN: ${{ secrets.RAFT_ARTIFACTS_PUBLISH_TOKEN }}
          DATETIME_STAGING_DIR: ${{ runner.temp }}/datetime-staging
        run: |
          set -euo pipefail
          cd DatetimeKMM
          bash scripts/publish-raft-artifacts.sh
      - name: Upload publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: datetime-raft-publish-ohos-tree
          path: ${{ runner.temp }}/datetime-staging.work/
          if-no-files-found: error
          retention-days: 90

  publish-android:
    name: Publish Android (normal tree)
    needs: [admission, preflight-android, preflight-ohos, preflight-ios]
    runs-on: ubuntu-latest
    environment: raft-artifacts-production
    container:
      image: ghcr.io/bytemain/harmony-next-pipeline-docker/harmonyos-ci-image:v6.1.1.280
    permissions:
      contents: read
    env:
      DATETIME_PUBLISH_MODE: android
      MAVEN_VERSION: ${{ needs.admission.outputs.version }}
    outputs:
      published_count: ${{ steps.publish.outputs.published_count }}
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
        shell: bash
      - name: Stage, classify, publish, verify (fail-closed)
        id: publish
        shell: bash
        env:
          RAFT_ARTIFACTS_USERNAME: raft-ci
          RAFT_ARTIFACTS_PUBLISH_TOKEN: ${{ secrets.RAFT_ARTIFACTS_PUBLISH_TOKEN }}
          DATETIME_STAGING_DIR: ${{ runner.temp }}/datetime-staging
        run: |
          set -euo pipefail
          cd DatetimeKMM
          bash scripts/publish-raft-artifacts.sh
      - name: Upload publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: datetime-raft-publish-android
          path: ${{ runner.temp }}/datetime-staging.work/
          if-no-files-found: error
          retention-days: 90

  publish-ios:
    name: Publish iOS (normal tree, 3 targets)
    needs: [admission, preflight-android, preflight-ohos, preflight-ios]
    runs-on: macos-latest
    environment: raft-artifacts-production
    permissions:
      contents: read
    env:
      ANDROID_HOME: /tmp/android-sdk
      ANDROID_SDK_ROOT: /tmp/android-sdk
      DATETIME_PUBLISH_MODE: ios
      MAVEN_VERSION: ${{ needs.admission.outputs.version }}
    outputs:
      published_count: ${{ steps.publish.outputs.published_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL "$ANDROID_SDK_ZIP" -o /tmp/act.zip
          unzip -q /tmp/act.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
      - name: Stage, classify, publish, verify (fail-closed)
        id: publish
        shell: bash
        env:
          RAFT_ARTIFACTS_USERNAME: raft-ci
          RAFT_ARTIFACTS_PUBLISH_TOKEN: ${{ secrets.RAFT_ARTIFACTS_PUBLISH_TOKEN }}
          DATETIME_STAGING_DIR: ${{ runner.temp }}/datetime-staging
        run: |
          set -euo pipefail
          cd DatetimeKMM
          bash scripts/publish-raft-artifacts.sh
      - name: Upload publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: datetime-raft-publish-ios
          path: ${{ runner.temp }}/datetime-staging.work/
          if-no-files-found: error
          retention-days: 90

  publish-metadata:
    name: Publish KMP metadata (normal tree root)
    needs: [admission, preflight-android, preflight-ohos, preflight-ios, publish-android, publish-ios]
    runs-on: macos-latest
    environment: raft-artifacts-production
    permissions:
      contents: read
    env:
      ANDROID_HOME: /tmp/android-sdk
      ANDROID_SDK_ROOT: /tmp/android-sdk
      DATETIME_PUBLISH_MODE: metadata
      MAVEN_VERSION: ${{ needs.admission.outputs.version }}
    outputs:
      published_count: ${{ steps.publish.outputs.published_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL "$ANDROID_SDK_ZIP" -o /tmp/act.zip
          unzip -q /tmp/act.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
      - name: Stage, classify, publish, verify (fail-closed)
        id: publish
        shell: bash
        env:
          RAFT_ARTIFACTS_USERNAME: raft-ci
          RAFT_ARTIFACTS_PUBLISH_TOKEN: ${{ secrets.RAFT_ARTIFACTS_PUBLISH_TOKEN }}
          DATETIME_STAGING_DIR: ${{ runner.temp }}/datetime-staging
        run: |
          set -euo pipefail
          cd DatetimeKMM
          bash scripts/publish-raft-artifacts.sh
      - name: Upload publication receipt
        uses: actions/upload-artifact@v4
        with:
          name: datetime-raft-publish-metadata
          path: ${{ runner.temp }}/datetime-staging.work/
          if-no-files-found: error
          retention-days: 90

  # --- Terminal stale-rerun guard -------------------------------------------
  # Requires every write job to have succeeded and fails a fully-stale rerun
  # (zero newly-published publications must bump the version). The pre-publish
  # isolated legal gate above still runs before any write, and every write job
  # ends in a byte-exact Raft readback.
  stale-rerun-guard:
    name: Stale-rerun guard (require at least one newly published publication)
    needs:
      - admission
      - publish-ohos-tree
      - publish-android
      - publish-ios
      - publish-metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Stale-rerun guard
        shell: bash
        env:
          OHOS_N: ${{ needs.publish-ohos-tree.outputs.published_count }}
          ANDROID_N: ${{ needs.publish-android.outputs.published_count }}
          IOS_N: ${{ needs.publish-ios.outputs.published_count }}
          METADATA_N: ${{ needs.publish-metadata.outputs.published_count }}
        run: |
          set -euo pipefail
          total=$(( ${OHOS_N:-0} + ${ANDROID_N:-0} + ${IOS_N:-0} + ${METADATA_N:-0} ))
          echo "newly published publications: ohos=${OHOS_N:-0} android=${ANDROID_N:-0} ios=${IOS_N:-0} metadata=${METADATA_N:-0} total=$total"
          if [[ "$total" -eq 0 ]]; then
            echo "::error::Fully stale rerun: every publication already exists and nothing new was published. Raft release coordinates are immutable - bump mavenVersion via a source PR to ship new content."
            exit 1
          fi
