name: Publish KmmResource to GitHub Packages and Raft

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override Maven version, for example 0.1.0-raft.0"
        required: false
        type: string
      publish_resource_compose:
        description: "Also publish standard Compose resource-compose artifacts"
        required: false
        type: boolean
        default: false
      android_ohos_publish_tasks:
        description: "Optional Android/OHOS publish task override"
        required: false
        type: string
      ios_publish_tasks:
        description: "Optional iOS publish task override"
        required: false
        type: string
      metadata_publish_tasks:
        description: "Optional KMP metadata publish task override"
        required: false
        type: string
  pull_request:
    paths:
      - '.github/workflows/publish-kmmresource-github-packages.yml'
      - 'KmmResource/buildSrc/src/main/kotlin/Publishing.kt'
      - 'KmmResource/scripts/*publish*'
  push:
    tags:
      - "kmmresource-v*"

permissions:
  contents: read

jobs:
  release:
    name: Resolve Maven version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: resolve
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          project_version=$(sed -n 's/^mavenVersion=//p' KmmResource/gradle.properties)
          version=${REQUESTED_VERSION:-$project_version}
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "kmmresource-v$project_version" && "$version" == "$project_version" ]]
          fi
          [[ "$version" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Check downloads from both repositories for an existing release
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          MAVEN_VERSION: ${{ steps.resolve.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 KmmResource/scripts/test-publish-staged.py downloads "$MAVEN_VERSION"

  publish-android-ohos-plugin:
    name: Stage Android, OHOS and the generator
    needs: release
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bytemain/harmony-next-pipeline-docker/harmonyos-ci-image:v6.1.1.280
    outputs:
      artifact: ${{ steps.archive.outputs.artifact-id }}
    env:
      ANDROID_HOME: /tmp/android-sdk
      ANDROID_SDK_ROOT: /tmp/android-sdk
      KMMRESOURCE_REQUIRE_TASKS: 'true'
      KMMRESOURCE_STAGE_LANE: linux
      KMMRESOURCE_INCLUDE_COMPOSE: ${{ inputs.publish_resource_compose || 'false' }}
      KMMRESOURCE_PUBLISH_TASKS: ${{ inputs.android_ohos_publish_tasks }}
      MAVEN_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends curl unzip
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-commandline-tools.zip
          unzip -q /tmp/android-commandline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Resolve HarmonyOS SDK
        shell: bash
        run: |
          set -euo pipefail
          ohos_sdk_home="${OHOS_SDK_HOME:-${OHOS_BASE_SDK_HOME:-/opt/harmonyos-tools/command-line-tools/sdk/default/openharmony}}"
          if [[ -z "$ohos_sdk_home" ]]; then
            echo "OHOS_SDK_HOME or OHOS_BASE_SDK_HOME is required." >&2
            exit 1
          fi
          if [[ ! -d "$ohos_sdk_home/native/sysroot" ]]; then
            echo "HarmonyOS SDK sysroot not found at $ohos_sdk_home/native/sysroot" >&2
            exit 1
          fi
          ohos_sdk_home="$(cd "$ohos_sdk_home" && pwd)"
          deveco_sdk_home="${DEVECO_SDK_HOME:-$(cd "$ohos_sdk_home/../.." && pwd)}"
          deveco_studio_home="${DEVECO_STUDIO_HOME:-$(cd "$deveco_sdk_home/.." && pwd)}"

          echo "OHOS_SDK_HOME=$ohos_sdk_home" >> "$GITHUB_ENV"
          echo "OHOS_BASE_SDK_HOME=$ohos_sdk_home" >> "$GITHUB_ENV"
          echo "OHOS_NDK_HOME=$ohos_sdk_home" >> "$GITHUB_ENV"
          echo "OHOS_LLVM_HOME=$ohos_sdk_home/native/llvm" >> "$GITHUB_ENV"
          echo "DEVECO_SDK_HOME=$deveco_sdk_home" >> "$GITHUB_ENV"
          echo "DEVECO_STUDIO_HOME=$deveco_studio_home" >> "$GITHUB_ENV"
          echo "$ohos_sdk_home/toolchains" >> "$GITHUB_PATH"
          echo "$ohos_sdk_home/native/llvm/bin" >> "$GITHUB_PATH"

      - name: Validate string lookup contracts
        shell: bash
        run: |
          set -euo pipefail
          cd KmmResource
          ./gradlew --no-daemon --console=plain \
            -PkmmResourcePublishOnly=true \
            :resource-core:testDebugUnitTest \
            :resource-core:compileTestKotlinOhosArm64

      - name: Stage selected Maven publications
        shell: bash
        run: |
          export KMMRESOURCE_STAGING_DIR="$GITHUB_WORKSPACE/staged-maven"
          KmmResource/scripts/publish-github-packages.sh

      - name: Save the Maven files for this build
        id: archive
        uses: actions/upload-artifact@v4
        with:
          name: kmmresource-linux-${{ github.run_attempt }}
          path: staged-maven/
          if-no-files-found: error

  publish-ios:
    name: Stage iOS
    needs: release
    runs-on: macos-latest
    outputs:
      artifact: ${{ steps.archive.outputs.artifact-id }}
    env:
      ANDROID_HOME: /tmp/android-sdk
      ANDROID_SDK_ROOT: /tmp/android-sdk
      KMMRESOURCE_REQUIRE_TASKS: 'true'
      KMMRESOURCE_STAGE_LANE: ios
      KMMRESOURCE_INCLUDE_COMPOSE: ${{ inputs.publish_resource_compose || 'false' }}
      KMMRESOURCE_PUBLISH_TASKS: ${{ inputs.ios_publish_tasks }}
      MAVEN_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip -o /tmp/android-commandline-tools.zip
          unzip -q /tmp/android-commandline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Stage selected Maven publications
        shell: bash
        run: |
          export KMMRESOURCE_STAGING_DIR="$GITHUB_WORKSPACE/staged-maven"
          KmmResource/scripts/publish-github-packages.sh

      - name: Save the Maven files for this build
        id: archive
        uses: actions/upload-artifact@v4
        with:
          name: kmmresource-ios-${{ github.run_attempt }}
          path: staged-maven/
          if-no-files-found: error

  publish-kmp-metadata:
    name: Stage KMP metadata
    needs: release
    runs-on: macos-latest
    outputs:
      artifact: ${{ steps.archive.outputs.artifact-id }}
    env:
      ANDROID_HOME: /tmp/android-sdk
      ANDROID_SDK_ROOT: /tmp/android-sdk
      KMMRESOURCE_REQUIRE_TASKS: 'true'
      KMMRESOURCE_STAGE_LANE: metadata
      KMMRESOURCE_INCLUDE_COMPOSE: ${{ inputs.publish_resource_compose || 'false' }}
      KMMRESOURCE_PUBLISH_TASKS: ${{ inputs.metadata_publish_tasks }}
      MAVEN_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip -o /tmp/android-commandline-tools.zip
          unzip -q /tmp/android-commandline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Stage selected Maven publications
        shell: bash
        run: |
          export KMMRESOURCE_STAGING_DIR="$GITHUB_WORKSPACE/staged-maven"
          KmmResource/scripts/publish-github-packages.sh

      - name: Save the Maven files for this build
        id: archive
        uses: actions/upload-artifact@v4
        with:
          name: kmmresource-metadata-${{ github.run_attempt }}
          path: staged-maven/
          if-no-files-found: error

  publish:
    name: Upload and verify both Maven repositories
    if: github.event_name != 'pull_request'
    needs: [release, publish-android-ohos-plugin, publish-ios, publish-kmp-metadata]
    runs-on: ubuntu-latest
    environment: raft-artifacts-production
    concurrency:
      group: kmmresource-maven-publish
      queue: max
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.publish-android-ohos-plugin.outputs.artifact }},${{ needs.publish-ios.outputs.artifact }},${{ needs.publish-kmp-metadata.outputs.artifact }}
          path: staged
      - name: Publish the staged files and check each destination
        env:
          MAVEN_VERSION: ${{ needs.release.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
          RAFT_ARTIFACTS_PUBLISH_TOKEN: ${{ secrets.RAFT_ARTIFACTS_PUBLISH_TOKEN }}
        run: python3 KmmResource/scripts/publish-staged.py staged "$MAVEN_VERSION" --receipt publication.json
      - uses: actions/upload-artifact@v4
        with:
          name: kmmresource-publication-${{ github.run_attempt }}
          path: publication.json
          if-no-files-found: error

  verify-staging:
    name: Check the staged KmmResource release
    if: github.event_name == 'pull_request'
    needs: [release, publish-android-ohos-plugin, publish-ios, publish-kmp-metadata]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.publish-android-ohos-plugin.outputs.artifact }},${{ needs.publish-ios.outputs.artifact }},${{ needs.publish-kmp-metadata.outputs.artifact }}
          path: build-artifacts
      - name: Verify dual upload and interrupted delivery with these build artifacts
        env:
          MAVEN_VERSION: ${{ needs.release.outputs.version }}
        run: python3 KmmResource/scripts/test-publish-staged.py staged build-artifacts "$MAVEN_VERSION" --require-standard
