  verify-published:
    name: Verify dual publication changed or converged
    needs:
      - publish-ohos-tree
      - publish-ios
      - publish-android
      - publish-kmp-metadata
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail on a broken lane or a stale all-skipped release
        shell: bash
        env:
          OHOS_RESULT: ${{ needs.publish-ohos-tree.result }}
          IOS_RESULT: ${{ needs.publish-ios.result }}
          ANDROID_RESULT: ${{ needs.publish-android.result }}
          METADATA_RESULT: ${{ needs.publish-kmp-metadata.result }}
          OHOS_SKIPPED: ${{ needs.publish-ohos-tree.outputs.skipped }}
          IOS_SKIPPED: ${{ needs.publish-ios.outputs.skipped }}
          ANDROID_SKIPPED: ${{ needs.publish-android.outputs.skipped }}
          METADATA_SKIPPED: ${{ needs.publish-kmp-metadata.outputs.skipped }}
        run: |
          set -euo pipefail
          for result in "$OHOS_RESULT" "$IOS_RESULT" "$ANDROID_RESULT" "$METADATA_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "At least one publication lane did not complete successfully." >&2
              exit 1
            fi
          done
          if [[ "$OHOS_SKIPPED" == "true" && "$IOS_SKIPPED" == "true" && "$ANDROID_SKIPPED" == "true" && "$METADATA_SKIPPED" == "true" ]]; then
            echo "Every immutable publication already existed in both repositories; bump mavenVersion instead of reusing a coordinate." >&2
            exit 1
          fi
          echo "Every lane converged in GitHub Packages and Raft Artifacts, and at least one immutable publication was new."
