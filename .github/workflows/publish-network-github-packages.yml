name: Publish NetworkKMM to GitHub Packages and Raft Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override Maven version, for example 0.1.0-raft.32"
        required: false
        type: string
      artifact_source_sha:
        description: "Exact landed source that produced an interrupted immutable version"
        required: false
        type: string
      android_ohos_publish_tasks:
        description: "Exact missing-task allowlist for an Android/OHOS immutable retry"
        required: false
        type: string
      ios_publish_tasks:
        description: "Exact missing-task allowlist for an iOS immutable retry"
        required: false
        type: string
      metadata_publish_tasks:
        description: "Exact missing-task allowlist for a metadata immutable retry"
        required: false
        type: string
  push:
    tags:
      - "network-v*"

permissions:
  contents: read
  packages: write

env:
  NETWORK_ARTIFACT_SOURCE_SHA: ${{ github.event.inputs.artifact_source_sha || github.sha }}

jobs:
  publish-ohos-tree:
    name: "Publish OHOS tree (GitHub Packages + Raft Artifacts)"
    runs-on: ubuntu-latest
    environment: raft-artifacts-production
    container:
      image: ghcr.io/bytemain/harmony-next-pipeline-docker/harmonyos-ci-image:v6.1.1.280
    outputs:
      skipped: ${{ steps.raft_plan.outputs.skipped }}
    env:
      NETWORK_REQUIRE_TASKS: "true"
      NETWORK_SETTINGS_FILE: settings.ohos.gradle.kts
      NETWORK_REQUIRED_TASKS: >-
        :network:publishOhosArm64PublicationToGithubPackagesRepository
        :network-ohos-runtime:publishAllPublicationsToGithubPackagesRepository
        :network-ohos-runtime-gradle-plugin:publishAllPublicationsToGithubPackagesRepository
        :network:publishKotlinMultiplatformPublicationToGithubPackagesRepository
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve HarmonyOS SDK
        shell: bash
        run: |
          set -euo pipefail
          ohos_sdk_home="${OHOS_SDK_HOME:-${OHOS_BASE_SDK_HOME:-/opt/harmonyos-tools/command-line-tools/sdk/default/openharmony}}"
          test -n "$ohos_sdk_home"
          test -d "$ohos_sdk_home/native/sysroot"
          ohos_sdk_home="$(cd "$ohos_sdk_home" && pwd)"
          deveco_sdk_home="${DEVECO_SDK_HOME:-$(cd "$ohos_sdk_home/../.." && pwd)}"
          deveco_studio_home="${DEVECO_STUDIO_HOME:-$(cd "$deveco_sdk_home/.." && pwd)}"
          {
            echo "OHOS_SDK_HOME=$ohos_sdk_home"
            echo "OHOS_BASE_SDK_HOME=$ohos_sdk_home"
            echo "OHOS_NDK_HOME=$ohos_sdk_home"
            echo "OHOS_LLVM_HOME=$ohos_sdk_home/native/llvm"
            echo "DEVECO_SDK_HOME=$deveco_sdk_home"
            echo "DEVECO_STUDIO_HOME=$deveco_studio_home"
          } >> "$GITHUB_ENV"
          echo "$ohos_sdk_home/toolchains" >> "$GITHUB_PATH"
          echo "$ohos_sdk_home/native/llvm/bin" >> "$GITHUB_PATH"

      - name: Resolve publish inputs
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          project_version="$(sed -n 's/^mavenVersion=//p' NetworkKMM/gradle.properties | tail -n 1)"
          if [[ -n "${REQUESTED_VERSION:-}" ]]; then
            resolved_version="$REQUESTED_VERSION"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == network-v* ]]; then
            resolved_version="${GITHUB_REF_NAME#network-v}"
            test "$project_version" = "$resolved_version"
          else
            resolved_version="$project_version"
          fi
          if [[ ! "$resolved_version" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ || "$resolved_version" == *SNAPSHOT* || "$resolved_version" == *-ohos ]]; then
            echo "Invalid immutable Maven base version." >&2
            exit 1
          fi
          printf 'MAVEN_VERSION=%s\n' "$resolved_version" >> "$GITHUB_ENV"

      - name: Snapshot exact required primaries
        run: python3 NetworkKMM/scripts/network-raft-mirror.py snapshot-required --output /tmp/network-required.json

      - name: Prepare exact artifact source
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          [[ "$NETWORK_ARTIFACT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          if [[ "$NETWORK_ARTIFACT_SOURCE_SHA" == "$GITHUB_SHA" ]]; then
            echo "NETWORK_PROJECT_DIR=$GITHUB_WORKSPACE/NetworkKMM" >> "$GITHUB_ENV"
          else
            git fetch --no-tags --depth=1 origin "$NETWORK_ARTIFACT_SOURCE_SHA"
            git worktree add --detach /tmp/network-artifact-source "$NETWORK_ARTIFACT_SOURCE_SHA"
            echo "NETWORK_PROJECT_DIR=/tmp/network-artifact-source/NetworkKMM" >> "$GITHUB_ENV"
          fi

      - name: Plan GitHub Packages authority
        id: publication_state
        shell: bash
        env:
          GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NETWORK_PUBLISH_TASKS: ${{ github.event.inputs.android_ohos_publish_tasks }}
        run: NetworkKMM/scripts/network-publication-state.sh plan

      - name: Publish missing GitHub Packages authority files
        if: env.NETWORK_GITHUB_SKIP_PUBLISH != 'true'
        shell: bash
        env:
          GITHUB_PACKAGES_OWNER: ${{ github.repository_owner }}
          GITHUB_PACKAGES_REPOSITORY: ${{ github.event.repository.name }}
          GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: NetworkKMM/scripts/publish-github-packages.sh

      - name: Read GitHub authority and plan Raft primaries
        id: raft_plan
        env:
          GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NETWORK_REQUIRED_PATHS_FILE: /tmp/network-required.json
        run: |
          python3 NetworkKMM/scripts/network-raft-mirror.py authority --bytes-dir /tmp/network-authority --receipt /tmp/network-authority.json
          python3 NetworkKMM/scripts/network-raft-mirror.py plan --receipt /tmp/network-authority.json --output /tmp/network-raft-plan.json
          decision="$(python3 -c 'import json; print(json.load(open("/tmp/network-raft-plan.json"))["remote"]["decision"])')"
          test "$decision" != hold-conflict
          test "$decision" = noop-complete-identical && echo 'skipped=true' >> "$GITHUB_OUTPUT" || echo 'skipped=false' >> "$GITHUB_OUTPUT"

      - name: Mirror only missing Raft primaries
        if: steps.raft_plan.outputs.skipped != 'true'
        env:
          RAFT_ARTIFACTS_PUBLISH_TOKEN: ${{ secrets.RAFT_ARTIFACTS_PUBLISH_TOKEN }}
          NETWORK_REQUIRED_PATHS_FILE: /tmp/network-required.json
        run: python3 NetworkKMM/scripts/network-raft-mirror.py publish --receipt /tmp/network-authority.json --bytes-dir /tmp/network-authority --plan /tmp/network-raft-plan.json --output /tmp/network-writer.json

      - name: Verify anonymous Raft convergence
        env:
          NETWORK_REQUIRED_PATHS_FILE: /tmp/network-required.json
        run: python3 NetworkKMM/scripts/network-raft-mirror.py verify --receipt /tmp/network-authority.json --output /tmp/network-terminal.json

  publish-ios:
