name: Publish NetworkKMM to GitHub Packages and Raft Artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override Maven version, for example 0.1.0-raft.31"
        required: false
        type: string
      android_ohos_publish_tasks:
        description: "Exact missing-task allowlist for an Android/OHOS immutable retry"
        required: false
        type: string
      ios_publish_tasks:
        description: "Exact missing-task allowlist for an iOS immutable retry"
        required: false
        type: string
      metadata_publish_tasks:
        description: "Exact missing-task allowlist for a metadata immutable retry"
        required: false
        type: string
  push:
    tags:
      - "network-v*"

permissions:
  contents: read
  packages: write

jobs:
  publish-ohos-tree:
    name: "Publish OHOS tree (GitHub Packages + Raft Artifacts)"
    runs-on: ubuntu-latest
    environment: raft-artifacts-production
    container:
      image: ghcr.io/bytemain/harmony-next-pipeline-docker/harmonyos-ci-image:v6.1.1.280
    outputs:
      skipped: ${{ steps.publication_state.outputs.skipped }}
    env:
      NETWORK_REQUIRE_TASKS: "true"
      NETWORK_SETTINGS_FILE: settings.ohos.gradle.kts
      NETWORK_REQUIRED_TASKS: >-
        :network:publishOhosArm64PublicationToGithubPackagesRepository
        :network-ohos-runtime:publishAllPublicationsToGithubPackagesRepository
        :network-ohos-runtime-gradle-plugin:publishAllPublicationsToGithubPackagesRepository
        :network:publishKotlinMultiplatformPublicationToGithubPackagesRepository
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve HarmonyOS SDK
        shell: bash
        run: |
          set -euo pipefail
          ohos_sdk_home="${OHOS_SDK_HOME:-${OHOS_BASE_SDK_HOME:-/opt/harmonyos-tools/command-line-tools/sdk/default/openharmony}}"
          test -n "$ohos_sdk_home"
          test -d "$ohos_sdk_home/native/sysroot"
          ohos_sdk_home="$(cd "$ohos_sdk_home" && pwd)"
          deveco_sdk_home="${DEVECO_SDK_HOME:-$(cd "$ohos_sdk_home/../.." && pwd)}"
          deveco_studio_home="${DEVECO_STUDIO_HOME:-$(cd "$deveco_sdk_home/.." && pwd)}"
          echo "OHOS_SDK_HOME=$ohos_sdk_home" >> "$GITHUB_ENV"
          echo "OHOS_BASE_SDK_HOME=$ohos_sdk_home" >> "$GITHUB_ENV"
          echo "OHOS_NDK_HOME=$ohos_sdk_home" >> "$GITHUB_ENV"
          echo "OHOS_LLVM_HOME=$ohos_sdk_home/native/llvm" >> "$GITHUB_ENV"
          echo "DEVECO_SDK_HOME=$deveco_sdk_home" >> "$GITHUB_ENV"
          echo "DEVECO_STUDIO_HOME=$deveco_studio_home" >> "$GITHUB_ENV"
          echo "$ohos_sdk_home/toolchains" >> "$GITHUB_PATH"
          echo "$ohos_sdk_home/native/llvm/bin" >> "$GITHUB_PATH"

      - name: Resolve publish inputs
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          project_version="$(sed -n 's/^mavenVersion=//p' NetworkKMM/gradle.properties | tail -n 1)"
          if [[ -n "${REQUESTED_VERSION:-}" ]]; then
            resolved_version="$REQUESTED_VERSION"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == network-v* ]]; then
            resolved_version="${GITHUB_REF_NAME#network-v}"
            test "$project_version" = "$resolved_version"
          else
            resolved_version="$project_version"
          fi
          if [[ ! "$resolved_version" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ || "$resolved_version" == *SNAPSHOT* || "$resolved_version" == *-ohos ]]; then
            echo "Invalid immutable Maven base version." >&2
            exit 1
          fi
          printf 'MAVEN_VERSION=%s\n' "$resolved_version" >> "$GITHUB_ENV"

      - name: Plan immutable dual publication
        id: publication_state
        shell: bash
        env:
          GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NETWORK_PUBLISH_TASKS: ${{ github.event.inputs.android_ohos_publish_tasks }}
        run: NetworkKMM/scripts/network-publication-state.sh plan

      - name: Skip complete immutable lane
        if: env.NETWORK_SKIP_PUBLISH == 'true'
        shell: bash
        run: echo "The OHOS lane already exists completely in both repositories."

      - name: Publish missing OHOS files to both repositories
        if: env.NETWORK_SKIP_PUBLISH != 'true'
        shell: bash
        env:
          GITHUB_PACKAGES_OWNER: ${{ github.repository_owner }}
          GITHUB_PACKAGES_REPOSITORY: ${{ github.event.repository.name }}
          GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAFT_ARTIFACTS_PUBLISH_TOKEN: ${{ secrets.RAFT_ARTIFACTS_PUBLISH_TOKEN }}
        run: NetworkKMM/scripts/publish-github-packages.sh

      - name: Verify OHOS convergence in both repositories
        shell: bash
        env:
          GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: NetworkKMM/scripts/network-publication-state.sh verify

  publish-ios:
    name: Publish iOS (GitHub Packages + Raft Artifacts)
    runs-on: macos-latest
    environment: raft-artifacts-production
    outputs:
      skipped: ${{ steps.publication_state.outputs.skipped }}
    env:
      ANDROID_HOME: /tmp/android-sdk
      ANDROID_SDK_ROOT: /tmp/android-sdk
      NETWORK_REQUIRE_TASKS: "true"
      NETWORK_REQUIRED_TASKS: >-
        :network:publishIosX64PublicationToGithubPackagesRepository
        :network:publishIosArm64PublicationToGithubPackagesRepository
        :network:publishIosSimulatorArm64PublicationToGithubPackagesRepository
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip -o /tmp/android-command-line-tools.zip
          unzip -q /tmp/android-command-line-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Resolve publish inputs
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          project_version="$(sed -n 's/^mavenVersion=//p' NetworkKMM/gradle.properties | tail -n 1)"
          if [[ -n "${REQUESTED_VERSION:-}" ]]; then
            resolved_version="$REQUESTED_VERSION"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == network-v* ]]; then
            resolved_version="${GITHUB_REF_NAME#network-v}"
            test "$project_version" = "$resolved_version"
          else
            resolved_version="$project_version"
          fi
          if [[ ! "$resolved_version" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ || "$resolved_version" == *SNAPSHOT* || "$resolved_version" == *-ohos ]]; then
            echo "Invalid immutable Maven base version." >&2
            exit 1
          fi
          printf 'MAVEN_VERSION=%s\n' "$resolved_version" >> "$GITHUB_ENV"

      - name: Plan immutable dual publication
        id: publication_state
        shell: bash
        env:
          GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NETWORK_PUBLISH_TASKS: ${{ github.event.inputs.ios_publish_tasks }}
        run: NetworkKMM/scripts/network-publication-state.sh plan

      - name: Skip complete immutable lane
        if: env.NETWORK_SKIP_PUBLISH == 'true'
        shell: bash
        run: echo "The iOS lane already exists completely in both repositories."

      - name: Publish missing iOS files to both repositories
        if: env.NETWORK_SKIP_PUBLISH != 'true'
        shell: bash
        env:
          GITHUB_PACKAGES_OWNER: ${{ github.repository_owner }}
          GITHUB_PACKAGES_REPOSITORY: ${{ github.event.repository.name }}
          GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAFT_ARTIFACTS_PUBLISH_TOKEN: ${{ secrets.RAFT_ARTIFACTS_PUBLISH_TOKEN }}
        run: NetworkKMM/scripts/publish-github-packages.sh

      - name: Verify iOS convergence in both repositories
        shell: bash
        env:
          GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: NetworkKMM/scripts/network-publication-state.sh verify

  publish-android:
    name: Publish Android (GitHub Packages + Raft Artifacts)
    runs-on: ubuntu-latest
    environment: raft-artifacts-production
    container:
      image: ghcr.io/bytemain/harmony-next-pipeline-docker/harmonyos-ci-image:v6.1.1.280
    outputs:
      skipped: ${{ steps.publication_state.outputs.skipped }}
    env:
      NETWORK_REQUIRE_TASKS: "true"
      NETWORK_REQUIRED_TASKS: >-
        :network:publishAndroidPublicationToGithubPackagesRepository
        :network-android-curl-runtime:publishAndroidCurlRuntimePublicationToGithubPackagesRepository
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve publish inputs
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          project_version="$(sed -n 's/^mavenVersion=//p' NetworkKMM/gradle.properties | tail -n 1)"
          if [[ -n "${REQUESTED_VERSION:-}" ]]; then
            resolved_version="$REQUESTED_VERSION"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == network-v* ]]; then
            resolved_version="${GITHUB_REF_NAME#network-v}"
            test "$project_version" = "$resolved_version"
          else
            resolved_version="$project_version"
          fi
          if [[ ! "$resolved_version" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ || "$resolved_version" == *SNAPSHOT* || "$resolved_version" == *-ohos ]]; then
            echo "Invalid immutable Maven base version." >&2
            exit 1
          fi
          printf 'MAVEN_VERSION=%s\n' "$resolved_version" >> "$GITHUB_ENV"

      - name: Plan immutable dual publication
        id: publication_state
        shell: bash
        env:
          GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NETWORK_PUBLISH_TASKS: ${{ github.event.inputs.android_ohos_publish_tasks }}
        run: NetworkKMM/scripts/network-publication-state.sh plan

      - name: Skip complete immutable lane
        if: env.NETWORK_SKIP_PUBLISH == 'true'
        shell: bash
        run: echo "The Android lane already exists completely in both repositories."

      - name: Publish missing Android files to both repositories
        if: env.NETWORK_SKIP_PUBLISH != 'true'
        shell: bash
        env:
          GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAFT_ARTIFACTS_PUBLISH_TOKEN: ${{ secrets.RAFT_ARTIFACTS_PUBLISH_TOKEN }}
        run: NetworkKMM/scripts/publish-github-packages.sh

      - name: Verify Android convergence in both repositories
        shell: bash
        env:
          GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: NetworkKMM/scripts/network-publication-state.sh verify

  publish-kmp-metadata:
    name: Publish KMP metadata (GitHub Packages + Raft Artifacts)
    needs:
      - publish-android
      - publish-ios
    runs-on: macos-latest
    environment: raft-artifacts-production
    outputs:
      skipped: ${{ steps.publication_state.outputs.skipped }}
    env:
      ANDROID_HOME: /tmp/android-sdk
      ANDROID_SDK_ROOT: /tmp/android-sdk
      NETWORK_REQUIRE_TASKS: "true"
      NETWORK_REQUIRED_TASKS: >-
        :network:publishKotlinMultiplatformPublicationToGithubPackagesRepository
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip -o /tmp/android-command-line-tools.zip
          unzip -q /tmp/android-command-line-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Resolve publish inputs
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          project_version="$(sed -n 's/^mavenVersion=//p' NetworkKMM/gradle.properties | tail -n 1)"
          if [[ -n "${REQUESTED_VERSION:-}" ]]; then
            resolved_version="$REQUESTED_VERSION"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" && "${GITHUB_REF_NAME:-}" == network-v* ]]; then
            resolved_version="${GITHUB_REF_NAME#network-v}"
            test "$project_version" = "$resolved_version"
          else
            resolved_version="$project_version"
          fi
          if [[ ! "$resolved_version" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ || "$resolved_version" == *SNAPSHOT* || "$resolved_version" == *-ohos ]]; then
            echo "Invalid immutable Maven base version." >&2
            exit 1
          fi
          printf 'MAVEN_VERSION=%s\n' "$resolved_version" >> "$GITHUB_ENV"

      - name: Plan immutable dual publication
        id: publication_state
        shell: bash
        env:
          GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NETWORK_PUBLISH_TASKS: ${{ github.event.inputs.metadata_publish_tasks }}
        run: NetworkKMM/scripts/network-publication-state.sh plan

      - name: Skip complete immutable lane
        if: env.NETWORK_SKIP_PUBLISH == 'true'
        shell: bash
        run: echo "The metadata lane already exists completely in both repositories."

      - name: Publish missing metadata files to both repositories
        if: env.NETWORK_SKIP_PUBLISH != 'true'
        shell: bash
        env:
          GITHUB_PACKAGES_OWNER: ${{ github.repository_owner }}
          GITHUB_PACKAGES_REPOSITORY: ${{ github.event.repository.name }}
          GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAFT_ARTIFACTS_PUBLISH_TOKEN: ${{ secrets.RAFT_ARTIFACTS_PUBLISH_TOKEN }}
        run: NetworkKMM/scripts/publish-github-packages.sh

      - name: Verify metadata convergence in both repositories
        shell: bash
        env:
          GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: NetworkKMM/scripts/network-publication-state.sh verify

  verify-published:
    name: Verify dual publication changed or converged
    needs:
      - publish-ohos-tree
      - publish-ios
      - publish-android
      - publish-kmp-metadata
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail on a broken lane or a stale all-skipped release
        shell: bash
        env:
          OHOS_RESULT: ${{ needs.publish-ohos-tree.result }}
          IOS_RESULT: ${{ needs.publish-ios.result }}
          ANDROID_RESULT: ${{ needs.publish-android.result }}
          METADATA_RESULT: ${{ needs.publish-kmp-metadata.result }}
          OHOS_SKIPPED: ${{ needs.publish-ohos-tree.outputs.skipped }}
          IOS_SKIPPED: ${{ needs.publish-ios.outputs.skipped }}
          ANDROID_SKIPPED: ${{ needs.publish-android.outputs.skipped }}
          METADATA_SKIPPED: ${{ needs.publish-kmp-metadata.outputs.skipped }}
        run: |
          set -euo pipefail
          for result in "$OHOS_RESULT" "$IOS_RESULT" "$ANDROID_RESULT" "$METADATA_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "At least one publication lane did not complete successfully." >&2
              exit 1
            fi
          done
          if [[ "$OHOS_SKIPPED" == "true" && "$IOS_SKIPPED" == "true" && "$ANDROID_SKIPPED" == "true" && "$METADATA_SKIPPED" == "true" ]]; then
            echo "Every immutable publication already existed in both repositories; bump mavenVersion instead of reusing a coordinate." >&2
            exit 1
          fi
          echo "Every lane converged in GitHub Packages and Raft Artifacts, and at least one immutable publication was new."
