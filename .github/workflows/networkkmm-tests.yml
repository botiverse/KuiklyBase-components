name: NetworkKMM tests

on:
  pull_request:
    paths:
      - "NetworkKMM/**"
      - "knoi/**"
      - ".github/workflows/networkkmm-tests.yml"
      - ".github/workflows/publish-network-github-packages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-contract:
    name: Immutable GitHub + Raft publication contract
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bytemain/harmony-next-pipeline-docker/harmonyos-ci-image:v6.1.1.280
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve HarmonyOS SDK
        shell: bash
        run: |
          set -euo pipefail
          ohos_sdk_home="${OHOS_SDK_HOME:-${OHOS_BASE_SDK_HOME:-/opt/harmonyos-tools/command-line-tools/sdk/default/openharmony}}"
          test -d "$ohos_sdk_home/native/sysroot"
          ohos_sdk_home="$(cd "$ohos_sdk_home" && pwd)"
          echo "OHOS_SDK_HOME=$ohos_sdk_home" >> "$GITHUB_ENV"
          echo "OHOS_BASE_SDK_HOME=$ohos_sdk_home" >> "$GITHUB_ENV"
          echo "OHOS_NDK_HOME=$ohos_sdk_home" >> "$GITHUB_ENV"
          echo "OHOS_LLVM_HOME=$ohos_sdk_home/native/llvm" >> "$GITHUB_ENV"

      - name: Run dual-publication static contract and mutation teeth
        shell: bash
        run: python3 NetworkKMM/scripts/verify-network-dual-publication-contract.py

      - name: Discover and dry-run both normal-tree repositories
        shell: bash
        env:
          GITHUB_PACKAGES_USERNAME: contract-user
          GITHUB_PACKAGES_TOKEN: contract-token
          RAFT_ARTIFACTS_PUBLISH_TOKEN: contract-token
          NETWORK_DRY_RUN: "true"
          NETWORK_REQUIRE_TASKS: "true"
          NETWORK_REQUIRED_TASKS: >-
            :network:publishAndroidPublicationToGithubPackagesRepository
            :network-android-curl-runtime:publishAndroidCurlRuntimePublicationToGithubPackagesRepository
            :network:publishKotlinMultiplatformPublicationToGithubPackagesRepository
        run: NetworkKMM/scripts/publish-github-packages.sh

      - name: Discover and dry-run both OHOS-tree repositories
        shell: bash
        env:
          GITHUB_PACKAGES_USERNAME: contract-user
          GITHUB_PACKAGES_TOKEN: contract-token
          RAFT_ARTIFACTS_PUBLISH_TOKEN: contract-token
          NETWORK_DRY_RUN: "true"
          NETWORK_REQUIRE_TASKS: "true"
          NETWORK_SETTINGS_FILE: settings.ohos.gradle.kts
          NETWORK_REQUIRED_TASKS: >-
            :network:publishOhosArm64PublicationToGithubPackagesRepository
            :network-ohos-runtime:publishAllPublicationsToGithubPackagesRepository
            :network-ohos-runtime-gradle-plugin:publishAllPublicationsToGithubPackagesRepository
            :network:publishKotlinMultiplatformPublicationToGithubPackagesRepository
        run: NetworkKMM/scripts/publish-github-packages.sh

  publication-contract-ios:
    name: Immutable iOS publication task graph
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK needed during project configuration
        shell: bash
        env:
          ANDROID_HOME: /tmp/android-sdk
          ANDROID_SDK_ROOT: /tmp/android-sdk
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip -o /tmp/android-command-line-tools.zip
          unzip -q /tmp/android-command-line-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Discover and dry-run both iOS repositories
        shell: bash
        env:
          GITHUB_PACKAGES_USERNAME: contract-user
          GITHUB_PACKAGES_TOKEN: contract-token
          RAFT_ARTIFACTS_PUBLISH_TOKEN: contract-token
          NETWORK_DRY_RUN: "true"
          NETWORK_REQUIRE_TASKS: "true"
          NETWORK_REQUIRED_TASKS: >-
            :network:publishIosX64PublicationToGithubPackagesRepository
            :network:publishIosArm64PublicationToGithubPackagesRepository
            :network:publishIosSimulatorArm64PublicationToGithubPackagesRepository
        run: NetworkKMM/scripts/publish-github-packages.sh

  ca-bundle-contract:
    name: App-owned CA bundle pin
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Stage and verify pinned CA bundle
        shell: bash
        run: |
          source NetworkKMM/ca/curl-ca-bundle.env
          RUNTIME_MANIFEST=NetworkKMM/network/src/commonMain/kotlin/com/tencent/kmm/network/export/NetworkCurlRuntime.kt
          grep -Fq "const val VERSION: String = \"$NETWORKKMM_CURL_CA_VERSION\"" "$RUNTIME_MANIFEST"
          grep -Fq "const val SOURCE_URL: String = \"$NETWORKKMM_CURL_CA_SOURCE_URL\"" "$RUNTIME_MANIFEST"
          grep -Fq "const val SHA256: String = \"$NETWORKKMM_CURL_CA_SHA256\"" "$RUNTIME_MANIFEST"
          NetworkKMM/scripts/prepare-app-owned-ca-bundle.sh /tmp/networkkmm-cacert.pem
          test -s /tmp/networkkmm-cacert.pem

  android-unit-tests:
    name: Android unit tests (:network)
    runs-on: ubuntu-latest
    # The image bakes the Android SDK (platforms;android-36 + build-tools;
    # 36.0.0 at /opt/android-sdk, task #240) — no per-run download.
    container:
      image: ghcr.io/bytemain/harmony-next-pipeline-docker/harmonyos-ci-image:v6.1.1.280
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run :network Android unit tests
        shell: bash
        working-directory: NetworkKMM
        run: ./gradlew :network:testDebugUnitTest --no-daemon --stacktrace

      # The raft.11 publish failure (stdlib version leak ICE) only surfaced in
      # the publish job's metadata compilation — the android-only task graph
      # above never runs it. Compile common metadata here so dependency
      # resolution problems fail the PR, not the release.
      - name: Compile commonMain metadata
        shell: bash
        working-directory: NetworkKMM
        run: ./gradlew :network:compileCommonMainKotlinMetadata --no-daemon --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: network-test-reports
          path: NetworkKMM/network/build/reports/tests/

  android-curl-runtime-tests:
    name: Android curl runtime tests (emulator x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Stage pinned public CA for HTTP/3 runtime gate
        shell: bash
        run: |
          set -euo pipefail
          asset_dir="NetworkKMM/network/src/androidTest/assets"
          mkdir -p "$asset_dir"
          NetworkKMM/scripts/prepare-app-owned-ca-bundle.sh \
            "$asset_dir/networkkmm-cacert.pem"

      - name: Run committed Android curl artifact runtime gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: >-
            cd NetworkKMM &&
            ./gradlew :network:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.tencent.kmm.network.internal.platform.AndroidCurlRuntimeInstrumentedTest
            --no-daemon --stacktrace

      - name: Upload Android curl runtime report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: network-android-curl-runtime-report
          path: NetworkKMM/network/build/reports/androidTests/connected/

  darwin-behavior-tests:
    name: Darwin engine behavior tests (macosArm64)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Start local test server
        shell: bash
        run: |
          python3 NetworkKMM/tests/wrapper/test_server.py 18923 &
          echo $! > /tmp/test-server.pid
          for _ in $(seq 1 50); do
            curl -sf "http://127.0.0.1:18923/ok" >/dev/null 2>&1 && break
            sleep 0.1
          done
          curl -sf "http://127.0.0.1:18923/ok" >/dev/null

      # Runs the SAME iosMain transport (ktor Darwin/NSURLSession) natively —
      # the engine-semantics lane iOS never had (raft.9 lesson). Bounded
      # per-test timeouts turn engine hangs into red tests, not stuck CI.
      - name: Run Darwin engine behavior tests
        shell: bash
        working-directory: NetworkKMM
        env:
          DARWIN_TEST_BASE_URL: http://127.0.0.1:18923
        run: ./gradlew :network:macosArm64Test -PdarwinBehaviorTests --console=plain --no-daemon --stacktrace

      - name: Verify caller-time deadline test executed
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          expected = "com.tencent.kmm.network.internal.platform.IosStreamWholeDeadlineBehaviorTest"
          files = glob.glob("NetworkKMM/network/build/test-results/macosArm64Test/*.xml")
          if not files:
              sys.exit("macosArm64Test produced no JUnit XML")
          matches = []
          for path in files:
              root = ET.parse(path).getroot()
              for case in root.iter("testcase"):
                  if case.attrib.get("classname") == expected:
                      matches.append((path, case))
          if len(matches) != 1:
              sys.exit(f"expected exactly one {expected} testcase, found {len(matches)}")
          path, case = matches[0]
          if case.find("failure") is not None or case.find("error") is not None:
              sys.exit(f"{expected} did not pass in {path}")
          print(f"verified {expected}.{case.attrib.get('name')} failures=0 errors=0 xml={path}")
          PY

      - name: Upload Darwin test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: networkkmm-macos-arm64-test-results
          path: NetworkKMM/network/build/test-results/macosArm64Test
          if-no-files-found: warn
          retention-days: 14

      - name: Stop test server
        if: always()
        shell: bash
        run: kill "$(cat /tmp/test-server.pid)" 2>/dev/null || true

  ios-curl-runtime-tests:
    name: iOS curl runtime tests (Simulator)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run production iOS curl runtime tests
        shell: bash
        env:
          NETWORKKMM_IOS_CURL_OPTIONAL_API_EXPECTATION: unavailable
        run: NetworkKMM/scripts/run-ios-curl-runtime-tests.sh

      - name: Upload iOS curl test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: network-ios-curl-test-reports
          path: |
            NetworkKMM/network/build/reports/tests/iosSimulatorArm64Test/
            NetworkKMM/network/build/test-results/iosSimulatorArm64Test/
            NetworkKMM/network/build/reports/tests/iosX64Test/
            NetworkKMM/network/build/test-results/iosX64Test/

  ohos-tree:
    name: OHOS tree compile & publication metadata (:network)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bytemain/harmony-next-pipeline-docker/harmonyos-ci-image:v6.1.1.280
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve HarmonyOS SDK
        shell: bash
        run: |
          set -euo pipefail
          ohos_sdk_home="${OHOS_SDK_HOME:-${OHOS_BASE_SDK_HOME:-/opt/harmonyos-tools/command-line-tools/sdk/default/openharmony}}"
          test -d "$ohos_sdk_home/native/sysroot" || { echo "HarmonyOS SDK sysroot not found at $ohos_sdk_home"; exit 1; }
          ohos_sdk_home="$(cd "$ohos_sdk_home" && pwd)"
          deveco_sdk_home="${DEVECO_SDK_HOME:-$(cd "$ohos_sdk_home/../.." && pwd)}"
          deveco_studio_home="${DEVECO_STUDIO_HOME:-$(cd "$deveco_sdk_home/.." && pwd)}"
          echo "OHOS_SDK_HOME=$ohos_sdk_home" >> "$GITHUB_ENV"
          echo "OHOS_BASE_SDK_HOME=$ohos_sdk_home" >> "$GITHUB_ENV"
          echo "OHOS_NDK_HOME=$ohos_sdk_home" >> "$GITHUB_ENV"
          echo "OHOS_LLVM_HOME=$ohos_sdk_home/native/llvm" >> "$GITHUB_ENV"
          echo "DEVECO_SDK_HOME=$deveco_sdk_home" >> "$GITHUB_ENV"
          echo "DEVECO_STUDIO_HOME=$deveco_studio_home" >> "$GITHUB_ENV"
          echo "$ohos_sdk_home/toolchains" >> "$GITHUB_PATH"
          echo "$ohos_sdk_home/native/llvm/bin" >> "$GITHUB_PATH"

      # The OHOS tree (settings.ohos.gradle.kts) compiles with the KBA
      # toolchain and declares the KBA forks directly. Assert both halves of
      # the dual-tree contract on its publication metadata: the version
      # carries the -ohos suffix and the dependencies are the KBA forks.
      - name: Compile OHOS tree and verify publication metadata
        shell: bash
        working-directory: NetworkKMM
        run: |
          ./gradlew -c settings.ohos.gradle.kts :network:compileKotlinOhosArm64 --no-daemon --console=plain --stacktrace
          ./gradlew -c settings.ohos.gradle.kts :network:generateMetadataFileForOhosArm64Publication --no-daemon --console=plain
          MODULE_JSON=$(find network/build/publications -ipath "*ohosarm64*" -name "module.json" | head -1)
          test -n "$MODULE_JSON" || { echo "ohosArm64 module.json not generated"; exit 1; }
          grep -q '"version": "[^"]*-ohos"' "$MODULE_JSON" || {
            echo "ohos tree publication version does not carry the -ohos suffix:"; grep '"version"' "$MODULE_JSON" | head -3; exit 1; }
          grep -A5 '"module": "kotlinx-coroutines-core"' "$MODULE_JSON" | grep -q "KBA" || {
            echo "ohos variant does not declare the KBA coroutines fork:"; grep -A5 'kotlinx-coroutines-core' "$MODULE_JSON" | head -20; exit 1; }
          grep -A5 '"module": "atomicfu"' "$MODULE_JSON" | grep -q "KBA" || {
            echo "ohos variant does not declare the KBA atomicfu fork:"; grep -A5 '"module": "atomicfu"' "$MODULE_JSON" | head -20; exit 1; }
