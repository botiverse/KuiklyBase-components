name: NetworkKMM tests

on:
  pull_request:
    paths:
      - "NetworkKMM/**"
      - "knoi/**"
      - ".github/workflows/networkkmm-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-unit-tests:
    name: Android unit tests (:network)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bytemain/harmony-next-pipeline-docker/harmonyos-ci-image:v6.1.1.280
    env:
      ANDROID_HOME: /tmp/android-sdk
      ANDROID_SDK_ROOT: /tmp/android-sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends curl unzip
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-commandline-tools.zip
          unzip -q /tmp/android-commandline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Run :network Android unit tests
        shell: bash
        working-directory: NetworkKMM
        run: ./gradlew :network:testDebugUnitTest --no-daemon --stacktrace

      # The raft.11 publish failure (stdlib version leak ICE) only surfaced in
      # the publish job's metadata compilation — the android-only task graph
      # above never runs it. Compile common metadata here so dependency
      # resolution problems fail the PR, not the release.
      - name: Compile commonMain metadata
        shell: bash
        working-directory: NetworkKMM
        run: ./gradlew :network:compileCommonMainKotlinMetadata --no-daemon --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: network-test-reports
          path: NetworkKMM/network/build/reports/tests/

  darwin-behavior-tests:
    name: Darwin engine behavior tests (macosArm64)
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Start local test server
        shell: bash
        run: |
          python3 NetworkKMM/tests/wrapper/test_server.py 18923 &
          echo $! > /tmp/test-server.pid
          for _ in $(seq 1 50); do
            curl -sf "http://127.0.0.1:18923/ok" >/dev/null 2>&1 && break
            sleep 0.1
          done
          curl -sf "http://127.0.0.1:18923/ok" >/dev/null

      # Runs the SAME iosMain transport (ktor Darwin/NSURLSession) natively —
      # the engine-semantics lane iOS never had (raft.9 lesson). Bounded
      # per-test timeouts turn engine hangs into red tests, not stuck CI.
      - name: Run Darwin engine behavior tests
        shell: bash
        working-directory: NetworkKMM
        env:
          DARWIN_TEST_BASE_URL: http://127.0.0.1:18923
        run: ./gradlew :network:macosArm64Test -PdarwinBehaviorTests --console=plain --no-daemon --stacktrace

      - name: Stop test server
        if: always()
        shell: bash
        run: kill "$(cat /tmp/test-server.pid)" 2>/dev/null || true

  ohos-tree:
    name: OHOS tree compile & publication metadata (:network)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bytemain/harmony-next-pipeline-docker/harmonyos-ci-image:v6.1.1.280
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve HarmonyOS SDK
        shell: bash
        run: |
          set -euo pipefail
          ohos_sdk_home="${OHOS_SDK_HOME:-${OHOS_BASE_SDK_HOME:-/opt/harmonyos-tools/command-line-tools/sdk/default/openharmony}}"
          test -d "$ohos_sdk_home/native/sysroot" || { echo "HarmonyOS SDK sysroot not found at $ohos_sdk_home"; exit 1; }
          ohos_sdk_home="$(cd "$ohos_sdk_home" && pwd)"
          deveco_sdk_home="${DEVECO_SDK_HOME:-$(cd "$ohos_sdk_home/../.." && pwd)}"
          deveco_studio_home="${DEVECO_STUDIO_HOME:-$(cd "$deveco_sdk_home/.." && pwd)}"
          echo "OHOS_SDK_HOME=$ohos_sdk_home" >> "$GITHUB_ENV"
          echo "OHOS_BASE_SDK_HOME=$ohos_sdk_home" >> "$GITHUB_ENV"
          echo "OHOS_NDK_HOME=$ohos_sdk_home" >> "$GITHUB_ENV"
          echo "OHOS_LLVM_HOME=$ohos_sdk_home/native/llvm" >> "$GITHUB_ENV"
          echo "DEVECO_SDK_HOME=$deveco_sdk_home" >> "$GITHUB_ENV"
          echo "DEVECO_STUDIO_HOME=$deveco_studio_home" >> "$GITHUB_ENV"
          echo "$ohos_sdk_home/toolchains" >> "$GITHUB_PATH"
          echo "$ohos_sdk_home/native/llvm/bin" >> "$GITHUB_PATH"

      # The OHOS tree (settings.ohos.gradle.kts) compiles with the KBA
      # toolchain and declares the KBA forks directly. Assert both halves of
      # the dual-tree contract on its publication metadata: the version
      # carries the -ohos suffix and the dependencies are the KBA forks.
      - name: Compile OHOS tree and verify publication metadata
        shell: bash
        working-directory: NetworkKMM
        run: |
          ./gradlew -c settings.ohos.gradle.kts :network:compileKotlinOhosArm64 --no-daemon --console=plain --stacktrace
          ./gradlew -c settings.ohos.gradle.kts :network:generateMetadataFileForOhosArm64Publication --no-daemon --console=plain
          MODULE_JSON=$(find network/build/publications -ipath "*ohosarm64*" -name "module.json" | head -1)
          test -n "$MODULE_JSON" || { echo "ohosArm64 module.json not generated"; exit 1; }
          grep -q '"version": "[^"]*-ohos"' "$MODULE_JSON" || {
            echo "ohos tree publication version does not carry the -ohos suffix:"; grep '"version"' "$MODULE_JSON" | head -3; exit 1; }
          grep -A5 '"module": "kotlinx-coroutines-core"' "$MODULE_JSON" | grep -q "KBA" || {
            echo "ohos variant does not declare the KBA coroutines fork:"; grep -A5 'kotlinx-coroutines-core' "$MODULE_JSON" | head -20; exit 1; }
          grep -A5 '"module": "atomicfu"' "$MODULE_JSON" | grep -q "KBA" || {
            echo "ohos variant does not declare the KBA atomicfu fork:"; grep -A5 '"module": "atomicfu"' "$MODULE_JSON" | head -20; exit 1; }
