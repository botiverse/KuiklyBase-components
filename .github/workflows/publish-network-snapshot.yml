name: Publish NetworkKMM Raft SNAPSHOT

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact NetworkKMM source commit to publish
        required: true
        type: string
      version:
        description: Snapshot Maven version, for example 0.1.0-raft.30-pr144-SNAPSHOT
        required: true
        type: string

permissions:
  contents: read

env:
  RAFT_MAVEN_BASE_URL: https://maven.artifacts.botiverse.dev
  RAFT_GROUP_PATH: com/tencent/kuiklybase
  RAFT_ARTIFACT: network

jobs:
  publish:
    name: Publish and read back NetworkKMM SNAPSHOT
    runs-on: ubuntu-latest
    environment: raft-artifacts-production
    steps:
      - name: Check out requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0

      - name: Validate source and version
        id: validate
        shell: bash
        env:
          REQUESTED_SOURCE: ${{ inputs.source_sha }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          source_sha="${REQUESTED_SOURCE:-${GITHUB_SHA}}"
          test "$(git rev-parse HEAD)" = "$source_sha"
          version="$REQUESTED_VERSION"
          [[ "$version" == *-SNAPSHOT ]] || { echo 'version must end with -SNAPSHOT' >&2; exit 1; }
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-raft\.[0-9]+-pr[0-9]+-SNAPSHOT$ ]] || { echo 'version format is not an approved probe version' >&2; exit 1; }
          grep -q '^mavenVersion=' NetworkKMM/gradle.properties
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "MAVEN_VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish to Raft Maven only
        working-directory: NetworkKMM
        env:
          RAFT_ARTIFACTS_PUBLISH_TOKEN: ${{ secrets.RAFT_ARTIFACTS_PUBLISH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RAFT_ARTIFACTS_PUBLISH_TOKEN"
          cat > /tmp/raft-maven.init.gradle.kts <<'EOF'
          import org.gradle.api.publish.PublishingExtension
          allprojects {
              pluginManager.withPlugin("maven-publish") {
                  extensions.configure<PublishingExtension> {
                      repositories.maven {
                          name = "raftMaven"
                          url = uri(System.getenv("RAFT_MAVEN_BASE_URL"))
                          credentials {
                              username = "token"
                              password = System.getenv("RAFT_ARTIFACTS_PUBLISH_TOKEN")
                          }
                      }
                  }
              }
          }
          EOF
          ./gradlew --no-daemon --stacktrace \
            -I /tmp/raft-maven.init.gradle.kts \
            -PmavenVersion="$MAVEN_VERSION" \
            :network:publishAllPublicationsToRaftMavenRepository \
            :network-android-curl-runtime:publishAllPublicationsToRaftMavenRepository

      - name: Anonymous readback and SHA-256 receipt
        shell: bash
        run: |
          set -euo pipefail
          base="$RAFT_MAVEN_BASE_URL/$RAFT_GROUP_PATH/$RAFT_ARTIFACT/$MAVEN_VERSION"
          curl --fail --silent --show-error --max-time 30 --output /tmp/maven-metadata.xml "$base/maven-metadata.xml"
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          root = ET.parse('/tmp/maven-metadata.xml').getroot()
          version = os.environ['MAVEN_VERSION']
          for item in root.findall('./versioning/snapshotVersions/snapshotVersion'):
              if item.findtext('extension') == 'pom' and item.findtext('classifier') is None:
                  value = item.findtext('value')
                  if value:
                      open('/tmp/snapshot-value', 'w').write(value)
                      break
          else:
              raise SystemExit(f'no POM snapshotVersion for {version}')
          PY
          snapshot_value="$(cat /tmp/snapshot-value)"
          for extension in pom module; do
            file="$RAFT_ARTIFACT-$snapshot_value.$extension"
            curl --fail --silent --show-error --max-time 30 --output "/tmp/network.$extension" "$base/$file"
            sha256sum "/tmp/network.$extension"
            echo "readback $base/$file"
          done
