# Builds the PRODUCTION iOS curl native artifact (task #24, consumed by the
# task #23 cinterop): shared pbcurlwrapper merged with static OpenSSL/curl
# into NetworkKMM/network/libs/ios/NetworkKMMCurl.xcframework (ios-arm64 +
# ios-arm64_x86_64-simulator, single static library per slice, wrapper
# headers + modulemap exposed). PR runs verify the native build; a
# workflow_dispatch with commit_binaries=true pushes the refreshed
# xcframework back to the branch (same committed-binary pattern as the
# Android/OHOS native lines).
name: NetworkKMM iOS native (curl)

on:
  workflow_dispatch:
    inputs:
      commit_binaries:
        description: "Commit the refreshed xcframework back to the branch"
        type: boolean
        default: false
  pull_request:
    paths:
      - "NetworkKMM/ohosApp/pbcurlwrapper/src/main/cpp/**"
      - "NetworkKMM/network/src/iosMain/**"
      - "NetworkKMM/network/src/iosTest/**"
      - "NetworkKMM/scripts/build-ios-curl.sh"
      - "NetworkKMM/scripts/assemble-ios-curl-xcframework.sh"
      - "NetworkKMM/scripts/ios-curl-xcframework-matrix.tsv"
      - "NetworkKMM/scripts/test-ios-curl-xcframework-assembler.sh"
      - "NetworkKMM/scripts/native-source-date-epoch.txt"
      - "NetworkKMM/scripts/run-ios-curl-runtime-tests.sh"
      - ".github/workflows/networkkmm-ios-native.yml"

permissions:
  contents: write

concurrency:
  group: networkkmm-ios-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build NetworkKMMCurl.xcframework
    runs-on: macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Record the committed xcframework's deterministic tree hash before the
      # build overwrites it in place; the freshness gate below compares
      # against this. The tree may be absent (first-ever build on a branch) —
      # the gate then asserts nothing on equality and only the marker counts
      # apply.
      - name: Record committed xcframework tree hash
        shell: bash
        run: |
          set -euo pipefail
          root="NetworkKMM/network/libs/ios/NetworkKMMCurl.xcframework"
          if [[ -d "$root" ]]; then
            echo "COMMITTED_TREE_SHA=$(find "$root" -type f -print0 | sort -z | xargs -0 shasum -a 256 | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_ENV"
          else
            echo "COMMITTED_TREE_SHA=<absent>" >> "$GITHUB_ENV"
          fi

      - name: Test deterministic xcframework assembler
        shell: bash
        run: bash NetworkKMM/scripts/test-ios-curl-xcframework-assembler.sh

      # OpenSSL/curl/nghttp2/nghttp3 cross-compiles dominate the wall clock
      # (3 slices); cache the per-slice trees by every bit-changing input.
      - name: Cache native dependency build trees
        uses: actions/cache@v4
        with:
          path: NetworkKMM/build/ios-curl
          key: ios-curl-${{ hashFiles('NetworkKMM/scripts/build-ios-curl.sh', 'NetworkKMM/scripts/assemble-ios-curl-xcframework.sh', 'NetworkKMM/scripts/ios-curl-xcframework-matrix.tsv', 'NetworkKMM/scripts/native-source-date-epoch.txt') }}

      - name: Build xcframework
        shell: bash
        run: bash NetworkKMM/scripts/build-ios-curl.sh

      # The script already nm-verifies the exported wrapper surface per slice;
      # re-check the layout contract the task #23 cinterop .def relies on.
      - name: Verify xcframework layout contract
        shell: bash
        run: |
          set -euo pipefail
          root="NetworkKMM/network/libs/ios/NetworkKMMCurl.xcframework"
          for slice in ios-arm64 ios-arm64_x86_64-simulator; do
            test -f "$root/$slice/libNetworkKMMCurl.a"
            test -f "$root/$slice/Headers/curl_wrapper.h"
            test -f "$root/$slice/Headers/module.modulemap"
          done
          lipo -info "$root/ios-arm64_x86_64-simulator/libNetworkKMMCurl.a" | grep -q "x86_64" || {
            echo "Simulator slice is not fat (missing x86_64)." >&2
            exit 1
          }
          echo "Layout OK: $(du -sh "$root" | cut -f1)"

      # Freshness gate: iOS native reproducibility is proven (two independent
      # CI runs — PR build vs dispatch build — from one source tree produced
      # byte-identical xcframeworks), so the committed tree must hash equal
      # to what the wrapper source just built. Assert only on pull_request:
      # workflow_dispatch with commit_binaries=true IS the refresh mechanism
      # (committed == old, built == new by design), so there only print both
      # hashes.
      - name: Freshness gate (committed vs rebuilt tree hash)
        shell: bash
        env:
          GATE_ASSERT: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          root="NetworkKMM/network/libs/ios/NetworkKMMCurl.xcframework"
          built_tree_sha="$(find "$root" -type f -print0 | sort -z | xargs -0 shasum -a 256 | shasum -a 256 | cut -d' ' -f1)"
          echo "committed_tree_sha=$COMMITTED_TREE_SHA"
          echo "built_tree_sha=$built_tree_sha"
          if [[ "$GATE_ASSERT" == "true" && "$built_tree_sha" != "$COMMITTED_TREE_SHA" ]]; then
            echo "::error::Committed iOS xcframework is stale relative to the wrapper source." >&2
            echo "Refresh it by dispatching this workflow with commit_binaries=true on the branch that changes the wrapper source: gh workflow run networkkmm-ios-native.yml --ref <branch> -f commit_binaries=true (source + refreshed binary land in the same reviewed PR)." >&2
            exit 1
          fi

      # Multiplex provenance: the raft.37 multiplex wait compiled into the
      # wrapper leaves exactly two marker strings per architecture slice
      # ("CURLOPT_PIPEWAIT failed" / "CURLMOPT_PIPELINING failed" from
      # curl_wrapper.cpp) — 2 in ios-arm64, 4 in the two-slice simulator fat
      # library. A future source or slice-matrix change that alters a count
      # must update these expectations deliberately — that is a human review
      # point, by design. Same PR-only assert / dispatch-print split.
      # grep -c exits 1 on a zero count, so capture with `|| true`.
      - name: Multiplex provenance markers
        shell: bash
        env:
          GATE_ASSERT: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          root="NetworkKMM/network/libs/ios/NetworkKMMCurl.xcframework"
          arm64_count="$(strings -a "$root/ios-arm64/libNetworkKMMCurl.a" | grep -cE 'CURLOPT_PIPEWAIT failed|CURLMOPT_PIPELINING failed' || true)"
          sim_count="$(strings -a "$root/ios-arm64_x86_64-simulator/libNetworkKMMCurl.a" | grep -cE 'CURLOPT_PIPEWAIT failed|CURLMOPT_PIPELINING failed' || true)"
          echo "ios-arm64 markers=$arm64_count (expected 2)"
          echo "simulator-fat markers=$sim_count (expected 4: two slices x 2)"
          if [[ "$GATE_ASSERT" == "true" ]]; then
            if [[ "$arm64_count" != "2" ]]; then
              echo "::error::Expected exactly 2 multiplex provenance markers in ios-arm64, got $arm64_count — the rebuilt wrapper does not match the reviewed raft.37+ source." >&2
              exit 1
            fi
            if [[ "$sim_count" != "4" ]]; then
              echo "::error::Expected exactly 4 multiplex provenance markers in the simulator fat library, got $sim_count — the rebuilt wrapper does not match the reviewed raft.37+ source (or the slice matrix changed; update the expectation deliberately)." >&2
              exit 1
            fi
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run production runtime against fresh xcframework
        shell: bash
        env:
          NETWORKKMM_IOS_CURL_OPTIONAL_API_EXPECTATION: available
        run: NetworkKMM/scripts/run-ios-curl-runtime-tests.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: networkkmmcurl-xcframework
          if-no-files-found: error
          path: NetworkKMM/network/libs/ios/NetworkKMMCurl.xcframework

  commit:
    name: Commit refreshed binaries
    if: github.event_name == 'workflow_dispatch' && inputs.commit_binaries
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: networkkmmcurl-xcframework
          path: /tmp/networkkmmcurl-xcframework

      - name: Place artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf NetworkKMM/network/libs/ios/NetworkKMMCurl.xcframework
          mkdir -p NetworkKMM/network/libs/ios
          cp -R /tmp/networkkmmcurl-xcframework NetworkKMM/network/libs/ios/NetworkKMMCurl.xcframework

      - name: Commit refreshed binaries back
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add NetworkKMM/network/libs/ios
          if git diff --cached --quiet; then
            echo "No binary changes to commit."
          else
            git commit -m "ci: refresh NetworkKMM iOS curl native binaries [skip ci]"
            git push
          fi
