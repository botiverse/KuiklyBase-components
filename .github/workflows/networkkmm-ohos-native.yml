name: Build NetworkKMM OHOS native

# Reproducibly cross-compiles the NetworkKMM OHOS native runtime
# (OpenSSL + curl + pbcurlwrapper, with TLS certificate verification) from
# source inside artin's harmonyos-ci-image, so the shipped libcurl.a /
# libopenssl.so / libpbcurlwrapper.so always match the checked-in sources
# instead of being hand-built. See NetworkKMM/scripts/build-ohos-native.sh.

on:
  workflow_dispatch:
    inputs:
      commit_binaries:
        description: "Commit the refreshed native binaries back to the branch"
        type: boolean
        default: false
  # Only mainline pushes here — PR branches are covered by the pull_request
  # trigger below, so a PR runs the build once, not twice.
  push:
    branches:
      - master
    paths:
      - "NetworkKMM/scripts/build-ohos-native.sh"
      - "NetworkKMM/settings.gradle.kts"
      - "NetworkKMM/ohosApp/pbcurlwrapper/src/main/cpp/**"
      - "NetworkKMM/network/src/commonMain/kotlin/com/tencent/kmm/network/curl/**"
      - "NetworkKMM/network/src/ohosArm64Main/kotlin/com/tencent/kmm/network/curl/**"
      - "NetworkKMM/network/src/nativeInterop/cinterop/**"
      - "NetworkKMM/network-host-native-tests/**"
      - ".github/workflows/networkkmm-ohos-native.yml"
  pull_request:
    paths:
      - "NetworkKMM/scripts/build-ohos-native.sh"
      - "NetworkKMM/settings.gradle.kts"
      - "NetworkKMM/ohosApp/pbcurlwrapper/src/main/cpp/**"
      - "NetworkKMM/network/src/commonMain/kotlin/com/tencent/kmm/network/curl/**"
      - "NetworkKMM/network/src/ohosArm64Main/kotlin/com/tencent/kmm/network/curl/**"
      - "NetworkKMM/network/src/nativeInterop/cinterop/**"
      - "NetworkKMM/network-host-native-tests/**"
      - ".github/workflows/networkkmm-ohos-native.yml"

jobs:
  # Behavior-contract tests: the wrapper built for the HOST (same sources,
  # system libcurl/zlib) against a local server. Locks down status passthrough
  # (the raft.3 bug class), error bodies, timeouts, redirects, POST bodies,
  # and share-handle connection pooling on every PR.
  wrapper-behavior-tests:
    name: Wrapper behavior tests (host build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev zlib1g-dev brotli zstd

      - name: Run behavior tests
        shell: bash
        env:
          WRAPPER_REQUIRE_ALL_CODECS: "1"
        run: bash NetworkKMM/tests/wrapper/run_tests.sh

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run Kotlin/Native host codec tests
        shell: bash
        run: |
          cd NetworkKMM
          # network-host-native-tests lives in the OHOS build tree
          # (settings.ohos.gradle.kts) since the task #18 dual-tree split —
          # the wrapper is OHOS-domain code.
          ./gradlew -c settings.ohos.gradle.kts :network-host-native-tests:linuxX64Test --console=plain --no-daemon

  build-native:
    name: Cross-compile OHOS native (OpenSSL + curl + wrapper)
    runs-on: ubuntu-latest
    # contents:write lets the commit_binaries dispatch push refreshed .so back.
    permissions:
      contents: write
    container:
      image: ghcr.io/bytemain/harmony-next-pipeline-docker/harmonyos-ci-image:v6.1.1.280
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Trust the checkout dir (container git ownership)
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve HarmonyOS SDK
        shell: bash
        run: |
          set -euo pipefail
          ohos_sdk_home="${OHOS_SDK_HOME:-${OHOS_BASE_SDK_HOME:-/opt/harmonyos-tools/command-line-tools/sdk/default/openharmony}}"
          if [[ ! -d "$ohos_sdk_home/native/sysroot" ]]; then
            echo "HarmonyOS SDK sysroot not found at $ohos_sdk_home/native/sysroot" >&2
            exit 1
          fi
          ohos_sdk_home="$(cd "$ohos_sdk_home" && pwd)"
          echo "OHOS_SDK_HOME=$ohos_sdk_home" >> "$GITHUB_ENV"
          echo "OHOS_BASE_SDK_HOME=$ohos_sdk_home" >> "$GITHUB_ENV"
          echo "$ohos_sdk_home/native/llvm/bin" >> "$GITHUB_PATH"

      - name: Ensure cmake
        shell: bash
        run: |
          set -euo pipefail
          if command -v cmake >/dev/null 2>&1; then
            echo "cmake present: $(cmake --version | head -1)"
            exit 0
          fi
          # Prefer the OHOS SDK's bundled cmake (matches ohos.toolchain.cmake).
          sdk_cmake_bin="$OHOS_SDK_HOME/native/build-tools/cmake/bin"
          if [[ -x "$sdk_cmake_bin/cmake" ]]; then
            echo "$sdk_cmake_bin" >> "$GITHUB_PATH"
            echo "Using OHOS SDK cmake at $sdk_cmake_bin"
            exit 0
          fi
          # Fallback: install from the distro.
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends cmake
          else
            echo "cmake not found: no SDK cmake at $sdk_cmake_bin and no apt-get" >&2
            exit 1
          fi

      - name: Build native runtime from source
        shell: bash
        run: |
          set -euo pipefail
          bash NetworkKMM/scripts/build-ohos-native.sh

      - name: Verify TLS is wired (verification on + CA path compiled in)
        shell: bash
        run: |
          set -euo pipefail
          cpp="NetworkKMM/ohosApp/pbcurlwrapper/src/main/cpp/wrapper/src/curl_wrapper.cpp"
          grep -q "CURLOPT_SSL_VERIFYPEER, 1L" "$cpp"
          grep -q "CURLOPT_SSL_VERIFYHOST, 2L" "$cpp"
          # Trust anchors come from the OHOS system CA store: curl/OpenSSL are
          # built with their default CA bundle/path compiled to /etc/ssl/certs.
          script="NetworkKMM/scripts/build-ohos-native.sh"
          grep -q "CURL_CA_PATH=/etc/ssl/certs" "$script"
          grep -q -- "--openssldir=/etc/ssl" "$script"
          echo "TLS verification + system CA path: OK"

      - name: Build paired OHOS Kotlin/Native consumer
        shell: bash
        run: |
          set -euo pipefail
          cd NetworkKMM
          ./gradlew -c settings.ohos.gradle.kts :network:linkDebugSharedOhosArm64 \
            --no-daemon --console=plain --stacktrace
          source_lib="network/build/bin/ohosArm64/debugShared/libkn.so"
          target_lib="ohosApp/entry/libs/arm64-v8a/libkn.so"
          test -s "$source_lib"
          cp "$source_lib" "$target_lib"
          symbols="$(readelf -Ws "$target_lib")"
          printf '%s\n' "$symbols" | grep ' UND StartRequestV27$' >/dev/null
          printf '%s\n' "$symbols" | grep ' UND StartStreamRequestV27$' >/dev/null
          printf '%s\n' "$symbols" | grep ' UND StartUploadRequestV27$' >/dev/null
          legacy_matches="$(printf '%s\n' "$symbols" | grep -E ' UND Start(Request|StreamRequest|UploadRequest)$' || true)"
          if [[ -n "$legacy_matches" ]]; then
            echo "OHOS Kotlin/Native consumer still imports legacy Start* symbols" >&2
            printf '%s\n' "$legacy_matches" >&2
            exit 1
          fi
          echo "OHOS Kotlin/Native consumer V27 imports:"
          printf '%s\n' "$symbols" | grep -E ' UND Start(Request|StreamRequest|UploadRequest)V27$'

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: networkkmm-ohos-native
          if-no-files-found: error
          path: |
            NetworkKMM/network/libs/libpbcurlwrapper.so
            NetworkKMM/network/libs/libopenssl.so
            NetworkKMM/network/libs/libc++_shared.so
            NetworkKMM/ohosApp/entry/libs/arm64-v8a/libpbcurlwrapper.so
            NetworkKMM/ohosApp/entry/libs/arm64-v8a/libopenssl.so
            NetworkKMM/ohosApp/entry/libs/arm64-v8a/libc++_shared.so
            NetworkKMM/ohosApp/entry/libs/arm64-v8a/libkn.so
            NetworkKMM/ohosApp/pbcurlwrapper/libs/arm64-v8a/libcurl.a
            NetworkKMM/ohosApp/pbcurlwrapper/libs/arm64-v8a/libnghttp3.a
            NetworkKMM/ohosApp/pbcurlwrapper/libs/arm64-v8a/libopenssl.so

      - name: Commit refreshed binaries back
        if: github.event_name == 'workflow_dispatch' && inputs.commit_binaries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            NetworkKMM/network/libs \
            NetworkKMM/ohosApp/entry/libs/arm64-v8a \
            NetworkKMM/ohosApp/pbcurlwrapper/libs/arm64-v8a
          if git diff --cached --quiet; then
            echo "No binary changes to commit."
          else
            git commit -m "ci: refresh NetworkKMM OHOS native binaries [skip ci]"
            git push
          fi
