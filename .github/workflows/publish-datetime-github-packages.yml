name: Publish DatetimeKMM to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional; must be empty or byte-equal to committed DatetimeKMM/gradle.properties mavenVersion"
        required: false
        type: string

# Serialize publish runs so two dispatches can never double-publish the same
# immutable coordinate.
concurrency:
  group: datetime-publish
  cancel-in-progress: false

# Minimal top-level permission; publish jobs escalate to packages:write and the
# readback job uses packages:read only.
permissions:
  contents: read

jobs:
  admission:
    name: Admission guard (master ref + committed version)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate ref and version
        id: resolve
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          # Only the protected master branch may publish a merged exact.
          if [[ "${GITHUB_REF}" != "refs/heads/master" ]]; then
            echo "::error::publish is only allowed from refs/heads/master (got ${GITHUB_REF})"
            exit 1
          fi
          committed="$(grep '^mavenVersion=' DatetimeKMM/gradle.properties | cut -d= -f2)"
          if [[ -n "${REQUESTED_VERSION:-}" && "${REQUESTED_VERSION}" != "$committed" ]]; then
            echo "::error::requested version '${REQUESTED_VERSION}' != committed mavenVersion '${committed}'; bump via a source PR first"
            exit 1
          fi
          if ! printf '%s' "$committed" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::unsafe mavenVersion format: ${committed}"
            exit 1
          fi
          echo "Publishing version: $committed"
          echo "version=$committed" >> "$GITHUB_OUTPUT"

  publish-ohos-tree:
    name: "Publish OHOS tree (ohosArm64 + root, -ohos)"
    needs: admission
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bytemain/harmony-next-pipeline-docker/harmonyos-ci-image:v6.1.1.280
    permissions:
      contents: read
      packages: write
    env:
      DATETIME_PUBLISH_MODE: ohos-tree
      DATETIME_SETTINGS_FILE: settings.ohos.gradle.kts
      MAVEN_VERSION: ${{ needs.admission.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Trust the checkout dir (container git ownership)
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve HarmonyOS SDK
        shell: bash
        run: |
          set -euo pipefail
          ohos_sdk_home="${OHOS_SDK_HOME:-${OHOS_BASE_SDK_HOME:-/opt/harmonyos-tools/command-line-tools/sdk/default/openharmony}}"
          test -d "$ohos_sdk_home/native/sysroot" || { echo "HarmonyOS SDK sysroot not found at $ohos_sdk_home"; exit 1; }
          ohos_sdk_home="$(cd "$ohos_sdk_home" && pwd)"
          deveco_sdk_home="${DEVECO_SDK_HOME:-$(cd "$ohos_sdk_home/../.." && pwd)}"
          deveco_studio_home="${DEVECO_STUDIO_HOME:-$(cd "$deveco_sdk_home/.." && pwd)}"
          echo "OHOS_SDK_HOME=$ohos_sdk_home" >> "$GITHUB_ENV"
          echo "OHOS_BASE_SDK_HOME=$ohos_sdk_home" >> "$GITHUB_ENV"
          echo "OHOS_NDK_HOME=$ohos_sdk_home" >> "$GITHUB_ENV"
          echo "OHOS_LLVM_HOME=$ohos_sdk_home/native/llvm" >> "$GITHUB_ENV"
          echo "DEVECO_SDK_HOME=$deveco_sdk_home" >> "$GITHUB_ENV"
          echo "DEVECO_STUDIO_HOME=$deveco_studio_home" >> "$GITHUB_ENV"
          echo "$ohos_sdk_home/toolchains" >> "$GITHUB_PATH"
          echo "$ohos_sdk_home/native/llvm/bin" >> "$GITHUB_PATH"

      - name: Publish OHOS publications (fail-closed admission)
        shell: bash
        env:
          GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd DatetimeKMM
          bash scripts/publish-github-packages.sh

  publish-android:
    name: Publish Android (normal tree)
    needs: admission
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/bytemain/harmony-next-pipeline-docker/harmonyos-ci-image:v6.1.1.280
    permissions:
      contents: read
      packages: write
    env:
      DATETIME_PUBLISH_MODE: android
      MAVEN_VERSION: ${{ needs.admission.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Trust the checkout dir (container git ownership)
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Publish Android publication (fail-closed admission)
        shell: bash
        env:
          GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd DatetimeKMM
          bash scripts/publish-github-packages.sh

  publish-ios:
    name: Publish iOS (normal tree, 3 targets)
    needs: admission
    runs-on: macos-latest
    permissions:
      contents: read
      packages: write
    env:
      ANDROID_HOME: /tmp/android-sdk
      ANDROID_SDK_ROOT: /tmp/android-sdk
      DATETIME_PUBLISH_MODE: ios
      MAVEN_VERSION: ${{ needs.admission.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip -o /tmp/android-commandline-tools.zip
          unzip -q /tmp/android-commandline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Publish iOS publications (fail-closed admission)
        shell: bash
        env:
          GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd DatetimeKMM
          bash scripts/publish-github-packages.sh

  publish-metadata:
    name: Publish KMP metadata (normal tree root)
    needs:
      - admission
      - publish-android
      - publish-ios
    runs-on: macos-latest
    permissions:
      contents: read
      packages: write
    env:
      ANDROID_HOME: /tmp/android-sdk
      ANDROID_SDK_ROOT: /tmp/android-sdk
      DATETIME_PUBLISH_MODE: metadata
      MAVEN_VERSION: ${{ needs.admission.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip -o /tmp/android-commandline-tools.zip
          unzip -q /tmp/android-commandline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Publish root metadata publication (fail-closed admission)
        shell: bash
        env:
          GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd DatetimeKMM
          bash scripts/publish-github-packages.sh

  # Real post-publish verification: require every publish job to have succeeded,
  # then authenticated-readback the FULL artifact matrix (Android, three iOS
  # targets, OHOS, normal + OHOS root metadata) with eventual-consistency retry,
  # checking coordinates/variant references and the PR #109 legal carriers. Uses
  # packages:read only. Fails closed on any missing artifact, auth error, or
  # legal-byte mismatch.
  verify-published:
    name: Verify published matrix + legal bytes (readback)
    needs:
      - admission
      - publish-ohos-tree
      - publish-android
      - publish-ios
      - publish-metadata
    runs-on: macos-latest
    permissions:
      contents: read
      packages: read
    env:
      ANDROID_HOME: /tmp/android-sdk
      ANDROID_SDK_ROOT: /tmp/android-sdk
      MAVEN_VERSION: ${{ needs.admission.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-mac-11076708_latest.zip -o /tmp/android-commandline-tools.zip
          unzip -q /tmp/android-commandline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Authenticated readback of full published matrix
        shell: bash
        env:
          GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd DatetimeKMM
          bash scripts/verify-published.sh
