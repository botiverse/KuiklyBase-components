# Builds the PRODUCTION Android curl native artifact (task #24): shared
# pbcurlwrapper + the task #22 JNI shim, statically linked against
# cross-compiled OpenSSL/curl, into per-ABI libnetworkkmmcurl.so under
# NetworkKMM/network/libs/android/<abi>/. The default Android AAR excludes the
# payload; PR runs keep it built and CI-gated (this is also the only lane that
# COMPILES the JNI shim — see the #66 seam review note); a workflow_dispatch
# with commit_binaries=true pushes refreshed .so files back to the branch
# (same committed-binary pattern as networkkmm-ohos-native).
name: NetworkKMM Android native (curl)

on:
  workflow_dispatch:
    inputs:
      commit_binaries:
        description: "Commit the refreshed native binaries back to the branch"
        type: boolean
        default: false
  pull_request:
    paths:
      - "NetworkKMM/ohosApp/pbcurlwrapper/src/main/cpp/**"
      - "NetworkKMM/network/src/androidMain/cpp/**"
      - "NetworkKMM/scripts/build-android-curl.sh"
      - "NetworkKMM/scripts/native-source-date-epoch.txt"
      - ".github/workflows/networkkmm-android-native.yml"

permissions:
  contents: write

concurrency:
  group: networkkmm-android-native-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "28.0.13004108"

jobs:
  build:
    name: Build libnetworkkmmcurl.so (${{ matrix.abi }})
    runs-on: ubuntu-latest
    # NDK/cmdline-tools/cmake/zstd/binutils baked in (task #28) — no per-run
    # SDK downloads. Pin the version tag, never :latest.
    container:
      image: ghcr.io/bytemain/kuikly-ci-images/android-ndk:v1.1.0
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Record the committed binary's hash before the build overwrites it in
      # place; the freshness gate below compares against this. The file may
      # be absent (first-ever build on a branch) — the gate then asserts
      # nothing on equality and only the marker count applies.
      - name: Record committed binary sha256
        shell: bash
        run: |
          set -euo pipefail
          so="NetworkKMM/network/libs/android/${{ matrix.abi }}/libnetworkkmmcurl.so"
          if [[ -f "$so" ]]; then
            echo "COMMITTED_SHA=$(sha256sum "$so" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          else
            echo "COMMITTED_SHA=<absent>" >> "$GITHUB_ENV"
          fi

      # OpenSSL/curl/nghttp2/nghttp3 cross-compiles dominate the wall clock;
      # cache their build trees keyed on everything that changes the bits.
      - name: Cache native dependency build trees
        uses: actions/cache@v4
        with:
          path: NetworkKMM/build/android-curl/${{ matrix.abi }}
          key: android-curl-${{ matrix.abi }}-${{ env.NDK_VERSION }}-${{ hashFiles('NetworkKMM/scripts/build-android-curl.sh', 'NetworkKMM/scripts/native-source-date-epoch.txt') }}

      # Seed the pinned OpenSSL/curl source tarballs baked into the image
      # (v1.1.0, build-time verified + labeled). fetch() sees them present,
      # skips the network, and still runs its unconditional SHA-256 check —
      # the image is a transport, never a trust root. -n keeps any
      # cache-restored copies (byte-identical by pin).
      - name: Seed pinned source tarballs from image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "NetworkKMM/build/android-curl/${{ matrix.abi }}/downloads"
          cp -n /opt/curl-src/*.tar.gz "NetworkKMM/build/android-curl/${{ matrix.abi }}/downloads/"

      - name: Build native artifact
        shell: bash
        env:
          ANDROID_ABI: ${{ matrix.abi }}
        run: bash NetworkKMM/scripts/build-android-curl.sh

      - name: Verify exported JNI surface
        shell: bash
        run: |
          set -euo pipefail
          so="NetworkKMM/network/libs/android/${{ matrix.abi }}/libnetworkkmmcurl.so"
          test -f "$so"
          # JNI_OnLoad must be exported for System.loadLibrary registration;
          # the wrapper's own entry points are linked statically inside.
          # grep without -q: it must consume all of nm's output — grep -q
          # exits on first match and the SIGPIPE kills the pipeline under
          # pipefail (exit 141; bit us in-container where GNU nm dies on it).
          nm -D "$so" | grep "JNI_OnLoad" >/dev/null
          echo "JNI surface OK: $(du -h "$so" | cut -f1)"

      # Freshness gate: Android native reproducibility is proven (two
      # independent CI runs — PR build vs dispatch build — from one source
      # tree produced byte-identical .so files), so the committed binary must
      # be byte-identical to what the wrapper source just built. Assert only
      # on pull_request: workflow_dispatch with commit_binaries=true IS the
      # refresh mechanism (committed == old, built == new by design), so
      # there only print both hashes.
      - name: Freshness gate (committed vs rebuilt sha256)
        shell: bash
        env:
          GATE_ASSERT: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          so="NetworkKMM/network/libs/android/${{ matrix.abi }}/libnetworkkmmcurl.so"
          built_sha="$(sha256sum "$so" | cut -d' ' -f1)"
          echo "committed_sha=$COMMITTED_SHA"
          echo "built_sha=$built_sha"
          if [[ "$GATE_ASSERT" == "true" && "$built_sha" != "$COMMITTED_SHA" ]]; then
            echo "::error::Committed Android native binary is stale relative to the wrapper source." >&2
            echo "Refresh it by dispatching this workflow with commit_binaries=true on the branch that changes the wrapper source: gh workflow run networkkmm-android-native.yml --ref <branch> -f commit_binaries=true (source + refreshed binary land in the same reviewed PR)." >&2
            exit 1
          fi

      # Multiplex provenance: the raft.37 multiplex wait compiled into the
      # wrapper leaves exactly two marker strings per slice
      # ("CURLOPT_PIPEWAIT failed" / "CURLMOPT_PIPELINING failed" from
      # curl_wrapper.cpp). A future source change that alters the count must
      # update this expectation deliberately — that is a human review point,
      # by design. Same PR-only assert / dispatch-print split as above.
      - name: Multiplex provenance markers
        shell: bash
        env:
          GATE_ASSERT: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          so="NetworkKMM/network/libs/android/${{ matrix.abi }}/libnetworkkmmcurl.so"
          count="$(strings -a "$so" | grep -cE 'CURLOPT_PIPEWAIT failed|CURLMOPT_PIPELINING failed' || true)"
          echo "multiplex_markers=$count (expected 2)"
          if [[ "$GATE_ASSERT" == "true" && "$count" != "2" ]]; then
            echo "::error::Expected exactly 2 multiplex provenance markers, got $count — the rebuilt wrapper does not match the reviewed raft.37+ source." >&2
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: networkkmmcurl-${{ matrix.abi }}
          if-no-files-found: error
          path: NetworkKMM/network/libs/android/${{ matrix.abi }}/libnetworkkmmcurl.so

  commit:
    name: Commit refreshed binaries
    if: github.event_name == 'workflow_dispatch' && inputs.commit_binaries
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: networkkmmcurl-*
          path: /tmp/networkkmmcurl

      - name: Place artifacts
        shell: bash
        run: |
          set -euo pipefail
          for abi in arm64-v8a x86_64; do
            mkdir -p "NetworkKMM/network/libs/android/$abi"
            cp "/tmp/networkkmmcurl/networkkmmcurl-$abi/libnetworkkmmcurl.so" \
               "NetworkKMM/network/libs/android/$abi/libnetworkkmmcurl.so"
          done

      - name: Commit refreshed binaries back
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add NetworkKMM/network/libs/android
          if git diff --cached --quiet; then
            echo "No binary changes to commit."
          else
            git commit -m "ci: refresh NetworkKMM Android curl native binaries [skip ci]"
            git push
          fi
