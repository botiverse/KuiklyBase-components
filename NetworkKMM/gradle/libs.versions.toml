[versions]
# Upstream coroutines/atomicfu for every target EXCEPT ohosArm64 (Kuikly
# guidance: iOS & Android use official kotlinx.coroutines). The KBA fork
# exists solely to add the ohos target — but it also alters symbol
# signatures (e.g. launch gained a Boolean parameter), so a klib compiled
# against the fork references fork-only symbols and IrLinkage-crashes at
# call time in any consumer that links upstream coroutines (the iOS login
# crash, 2026-07-08). Same base versions as the fork to minimize drift.
atomicfu = "0.23.2"
kotlinx-coroutines-core = "1.8.0"
# ohosArm64-only fork pins (see ohosArm64Main dependencies).
atomicfu-kba = "0.23.2-KBA-001"
kotlinx-coroutines-core-kba = "1.8.0-KBA-002"
ktor-client-core-version = "2.3.7"
kotlin-stdlib-platform-ext = "0.1.0"
# OkHttp 5.x is required for fastFallback (RFC 8305 Happy Eyeballs); the
# ktor-client-okhttp 2.3.7 POM only pulls 4.12.0, so the version is forced
# here. Stable release: the normal build tree compiles with upstream Kotlin
# 2.1.21, which reads OkHttp 5.x's Kotlin 2.2 metadata fine — the alpha.14
# pin existed only for the old single-tree KBA 2.0.21 toolchain (task #18
# dual-tree split removed that ceiling; the OHOS tree never sees OkHttp).
okhttp = "5.4.0"

[libraries]
atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
atomicfu-kba = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu-kba" }
kotlin-stdlib-platform-ext = { module = "com.tencent.tmm:kotlin-stdlib-platform-ext", version.ref = "kotlin-stdlib-platform-ext" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines-core" }
kotlinx-coroutines-core-kba = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines-core-kba" }
ktor-client-android = { module = "io.ktor:ktor-client-android", version.ref = "ktor-client-core-version" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor-client-core-version" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor-client-core-version" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
ktor-ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor-client-core-version" }

[plugins]

[bundles]
